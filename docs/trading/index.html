<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trading</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('../fonts/Inter-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');}
  :root{
    --paper:#ffffff; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:#e6e6e2; --rule:#c9c8c2; --wash:#f7f7f5;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --good:#006300; --bad:#c0392b; --warn:#9a6a00; --warnbg:#fdf4dd;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#0d0d0d; --surface:#161615; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:#272725; --rule:#3a3a37; --wash:#1e1e1c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#0ca30c; --bad:#e66767; --warn:#fab219; --warnbg:#2a2415;
  }}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper);
       line-height:1.5; font-variant-numeric:tabular-nums;}
  h1,h2{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px;}
  main{max-width:1060px; margin:0 auto; padding:28px clamp(16px,4vw,40px) 56px;}

  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 20px;
        flex-wrap:wrap; margin-bottom:18px;}
  .head h1{font-size:21px;}
  .head p{color:var(--ink2); font-size:13px; margin-top:3px;}
  .badge{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
         border:1px solid var(--s1); color:var(--s1); border-radius:999px; padding:2px 8px;
         vertical-align:3px;}
  .badge.live{border-color:var(--bad); color:var(--bad);}
  .fresh{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px;}
  .fresh button{font-size:12px; color:var(--ink2); border-bottom:1px solid var(--rule);}

  .note{border:1px solid var(--warn); background:var(--warnbg); border-radius:10px;
        padding:10px 14px; margin-bottom:14px; font-size:13px;}
  .note ul{margin:4px 0 0 17px;}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px; margin-bottom:10px;}
  .card{border:1px solid var(--line); border-radius:11px; padding:13px 15px; background:var(--surface);}
  .card .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em;}
  .card .v{font-family:'Space Grotesk',sans-serif; font-size:25px; font-weight:600;
           margin-top:2px; letter-spacing:-0.02em;}
  .card .s{font-size:12px; color:var(--ink2); margin-top:1px;}
  .up{color:var(--good);} .down{color:var(--bad);}

  .strip{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
         border:1px solid var(--line); border-radius:11px; padding:12px 15px;
         background:var(--surface); margin-bottom:10px; font-size:13px; color:var(--ink2);}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none;}
  .dot.on{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent);}
  .dot.off{background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent);}
  .strip b{font-family:'Space Grotesk',sans-serif; font-size:14.5px; color:var(--ink); font-weight:600;}
  .strip .sep{color:var(--rule);}

  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:10px; margin-bottom:10px;}
  .panel{border:1px solid var(--line); border-radius:11px; padding:14px 16px; background:var(--surface);}
  .panel h2{font-size:13px; margin-bottom:1px;}
  .panel .cap{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-bottom:6px;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .sw{width:10px; height:10px; border-radius:3px; flex:none;}
  .wrap{position:relative;}
  .tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--rule);
       border-radius:7px; padding:7px 9px; font-size:12px; box-shadow:0 3px 12px rgba(0,0,0,.1);
       opacity:0; transition:opacity .08s; min-width:128px; z-index:5;}
  .tip b{display:block; margin-bottom:3px; font-size:11.5px; color:var(--ink2);}
  .tip div{display:flex; justify-content:space-between; gap:10px;}
  .blank{font-size:12.5px; color:var(--muted); padding:28px 0; text-align:center;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-weight:600; font-size:11px; color:var(--muted); text-transform:uppercase;
     letter-spacing:.05em; padding:0 14px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:7px 14px 7px 0; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  td:last-child,th:last-child{padding-right:0;}
  .num{text-align:right;} th.num{text-align:right;}
  .sym{font-family:'Space Grotesk',sans-serif; font-weight:600;}
  .tag{font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
       border:1px solid var(--line); border-radius:4px; padding:1px 4px; margin-left:6px;}

  .log{font-size:12.5px; display:flex; gap:9px; padding:4px 0; color:var(--ink2);}
  .log time{color:var(--muted); font-size:11.5px; white-space:nowrap; width:86px; flex:none;}
  details summary{font-size:12px; color:var(--ink2); cursor:pointer; padding:2px 0;}
  @media (max-width:620px){ .hide-sm{display:none;} }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Trading bot <span class="badge" id="mode">—</span></h1>
      <p>An index core plus up to six trending stocks, traded automatically from a Raspberry Pi.</p>
    </div>
    <div class="fresh"><span id="fresh"></span><button type="button" id="refresh">Refresh</button></div>
  </div>
  <div id="body"><p class="blank">Loading…</p></div>
</main>

<script>
  const API = 'https://pi-status.pizza-calc-api.workers.dev';
  const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const REFRESH_MS = 10 * 60 * 1000;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => n == null ? '—' : '$' + Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
  const money2 = n => n == null ? '—' : '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = n => n == null ? '—' : (n >= 0 ? '+' : '') + (n*100).toFixed(1) + '%';
  const cls = n => n == null || Math.abs(n) < 5e-5 ? '' : n > 0 ? 'up' : 'down';
  const ago = s => s < 60 ? 'just now' : s < 3600 ? `${Math.round(s/60)} min ago`
                  : s < 86400 ? `${Math.round(s/3600)} h ago` : `${Math.round(s/86400)} d ago`;

  // Fixed order, never cycled. Validated for colour-vision separation in both
  // modes; every series is also direct-laballed so colour is never the only cue.
  const SERIES = [
    { key:'live',   name:'Model D', css:'--s1' },
    { key:'spy',    name:'SPY',     css:'--s2' },
    { key:'modelc', name:'Model C', css:'--s3' },
  ];
  let data = null;

  // ---- a line chart, built once and reused by both panels ----------------
  function lines(rows, series, xkey, opts){
    const o = Object.assign({ W:520, H:210, L:46, R:54, T:10, B:22, money:true }, opts||{});
    const n = rows.length;
    if(n < 2) return `<p class="blank">${esc(o.blank || 'Not enough data yet.')}</p>`;
    let lo = Infinity, hi = -Infinity;
    for(const r of rows) for(const s of series){ const v = r[s.key];
      if(v != null){ lo = Math.min(lo,v); hi = Math.max(hi,v); } }
    const pad = (hi-lo)*0.07 || 1; lo -= pad; hi += pad;
    const X = i => o.L + (i/(n-1))*(o.W-o.L-o.R);
    const Y = v => o.T + (1-(v-lo)/(hi-lo))*(o.H-o.T-o.B);
    let g = '';
    for(let t=0;t<=3;t++){ const v = lo+(hi-lo)*t/3, y = Y(v);
      g += `<line x1="${o.L}" x2="${o.W-o.R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`
         + `<text x="${o.L-7}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="var(--muted)">${o.money?money(v):v.toFixed(0)+'%'}</text>`; }
    const paths = series.map(s=>{
      const pts = rows.map((r,i)=> r[s.key]==null ? null : `${X(i).toFixed(1)},${Y(r[s.key]).toFixed(1)}`).filter(Boolean);
      if(pts.length<2) return '';
      const last = rows[n-1][s.key];
      return `<polyline fill="none" stroke="var(${s.css})" stroke-width="2" stroke-linejoin="round"
                stroke-linecap="round" ${s.dash?'stroke-dasharray="4 3"':''} points="${pts.join(' ')}"/>`
        + (last!=null ? `<circle cx="${X(n-1)}" cy="${Y(last)}" r="3" fill="var(${s.css})" stroke="var(--surface)" stroke-width="1.5"/>`
          + `<text x="${o.W-o.R+6}" y="${Y(last)+3.5}" font-size="10.5" font-weight="600" fill="var(${s.css})">${s.name}</text>` : '');
    }).join('');
    const xl = [0, n-1].map(i=>`<text x="${X(i)}" y="${o.H-5}" text-anchor="${i?'end':'start'}"
      font-size="10.5" fill="var(--muted)">${esc(rows[i][xkey])}</text>`).join('');
    return `<div class="wrap"><svg viewBox="0 0 ${o.W} ${o.H}" width="100%" role="img"
        aria-label="${esc(o.label||'')}" data-chart="${esc(o.id)}">
      ${g}<line x1="${o.L}" x2="${o.W-o.R}" y1="${o.H-o.B}" y2="${o.H-o.B}" stroke="var(--rule)"/>
      <line class="cx" x1="0" x2="0" y1="${o.T}" y2="${o.H-o.B}" stroke="var(--rule)" opacity="0"/>
      ${paths}${xl}
      <rect x="${o.L}" y="${o.T}" width="${o.W-o.L-o.R}" height="${o.H-o.T-o.B}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div></div>`;
  }

  function wire(root, rows, series, xkey, o){
    const svg = root.querySelector('svg'); if(!svg) return;
    const hit = svg.querySelector('.hit'), cx = svg.querySelector('.cx'),
          tip = root.querySelector('.tip');
    const n = rows.length;
    const move = e => {
      const r = svg.getBoundingClientRect();
      const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * o.W;
      let i = Math.round((px - o.L)/(o.W-o.L-o.R)*(n-1)); i = Math.max(0, Math.min(n-1, i));
      const X = o.L + (i/(n-1))*(o.W-o.L-o.R);
      cx.setAttribute('x1',X); cx.setAttribute('x2',X); cx.setAttribute('opacity','1');
      tip.innerHTML = `<b>${esc(rows[i][xkey])}</b>` + series.map(s=>
        `<div><span style="color:var(${s.css})">${s.name}</span><span>${rows[i][s.key]==null?'—':(o.money?money2(rows[i][s.key]):rows[i][s.key].toFixed(1)+'%')}</span></div>`).join('');
      tip.style.opacity = 1;
      tip.style.left = Math.min(Math.max(6, X/o.W*r.width + 10), r.width - 140) + 'px';
      tip.style.top = '6px';
    };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchmove', e => { move(e); e.preventDefault(); }, {passive:false});
    svg.addEventListener('mouseleave', () => { tip.style.opacity=0; cx.setAttribute('opacity','0'); });
  }

  // ---- momentum bars -----------------------------------------------------
  function bars(items){
    if(!items.length) return '<p class="blank">Nothing passing the screen.</p>';
    const max = Math.max(...items.map(c=>c.ret126));
    return `<table><tbody>${items.map(c=>{
      const w = Math.max(2, c.ret126/max*100);
      return `<tr><td class="sym" style="width:52px">${esc(c.t)}</td>
        <td><div style="background:var(--s1);height:9px;border-radius:0 4px 4px 0;width:${w.toFixed(1)}%"></div></td>
        <td class="num" style="width:62px">${pct(c.ret126)}</td></tr>`;}).join('')}</tbody></table>`;
  }

  function needs(d){
    const out = [], h = d.health || {};
    if(d.equity == null) out.push('No broker connection.');
    if(h.stale) out.push(`Price data is stale — newest bar ${esc(d.asof||'?')}.`);
    if(h.bars_failed > 20) out.push(`${h.bars_failed} of ${h.universe} symbols failed to download.`);
    const seen = new Set(out);
    for(const e of (d.events||[]).filter(e=>e.kind==='error')){
      const m = esc(e.msg); if(seen.has(m)) continue; seen.add(m); out.push(m);
      if(out.length>=4) break;
    }
    return out.length ? `<div class="note"><b>Needs attention</b><ul>${out.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : '';
  }

  function render(){
    const d = data;
    if(!d){ $('body').innerHTML = '<p class="blank">No snapshot yet.</p>'; return; }
    const b = d.benchmarks || {}, r = d.regime || {};
    $('mode').textContent = (d.mode||'').toUpperCase() || '—';
    $('mode').className = 'badge' + (d.mode === 'live' ? ' live' : '');
    const start = d.starting_equity || 0, gain = start ? d.equity/start - 1 : null;
    const pos = d.positions || [], pend = d.pending || [];

    // Worst peak-to-trough the live account has actually seen. This is the
    // number the whole strategy is built to keep small, so it gets a card.
    let peak = null, maxDD = null;
    const hist = (d.history||[]).filter(h => h.live != null);
    if(hist.length >= 2){           // one session has no peak to fall from
      for(const h of hist){
        peak = peak == null ? h.live : Math.max(peak, h.live);
        maxDD = Math.min(maxDD == null ? 0 : maxDD, h.live/peak - 1);
      }
    }

    const cards = `<div class="cards">
      <div class="card"><div class="k">Account</div><div class="v">${money2(d.equity)}</div>
        <div class="s ${cls(gain)}">${pct(gain)} from ${money(start)}</div></div>
      <div class="card"><div class="k">vs SPY</div>
        <div class="v ${cls((b.live_pct??0)-(b.spy_pct??0))}">${b.spy_pct==null?'—':pct((b.live_pct||0)-(b.spy_pct||0))}</div>
        <div class="s">index ${pct(b.spy_pct)}</div></div>
      <div class="card"><div class="k">Holdings</div><div class="v">${pos.length}</div>
        <div class="s">${pend.length} queued for the open</div></div>
      <div class="card"><div class="k">Worst drawdown</div><div class="v">${maxDD==null?'—':pct(maxDD)}</div>
        <div class="s">backtest said &minus;19.4%</div></div>
    </div>`;

    const brd = r.breadth||0, gate = r.gate||0.5;
    const strip = `<div class="strip"><span class="dot ${r.core_on?'on':'off'}"></span>
      <b>${r.core_on?'Risk on':'Risk off'}</b>
      <span class="sep">·</span><span>SPY ${r.spy_close?Number(r.spy_close).toFixed(0):'—'} vs 200-day ${r.spy_sma200?Number(r.spy_sma200).toFixed(0):'—'}</span>
      <span class="sep">·</span><span>breadth ${(brd*100).toFixed(0)}% (gate ${(gate*100).toFixed(0)}%)</span>
      <span class="sep">·</span><span>as of ${esc(d.asof||'—')}</span></div>`;

    const spy = (d.spy_series||[]).map(p=>({d:p.d, px:p.c, sma:p.m}));
    const spySeries = [{key:'px',name:'SPY',css:'--s1'},{key:'sma',name:'200-day',css:'--s2',dash:true}];
    const eq = d.history || [];

    const charts = `<div class="grid2">
      <div class="panel" id="p-spy"><h2>Market trend</h2>
        <div class="cap">Above the 200-day it holds the index. Below it, cash.</div>
        ${lines(spy, spySeries, 'd', {id:'spy', label:'SPY against its 200-day average'})}</div>
      <div class="panel" id="p-eq"><h2>Equity</h2>
        <div class="cap">Against buying the index, and against a reckless control.</div>
        <div class="legend">${SERIES.map(s=>`<span><i class="sw" style="background:var(${s.css})"></i>${s.name}</span>`).join('')}</div>
        ${lines(eq, SERIES, 'date', {id:'eq', blank:'Starts after two sessions close.', label:'Equity against benchmarks'})}</div>
    </div>`;

    const posPanel = `<div class="panel" style="margin-bottom:10px"><h2>Holdings</h2>
      <div class="cap">Satellite positions rest a stop with the broker.</div>
      ${pos.length ? `<table><thead><tr><th>Symbol</th><th class="num">Shares</th>
        <th class="num">Price</th><th class="num">Value</th><th class="num">P/L</th>
        <th class="num hide-sm">Stop</th></tr></thead><tbody>
        ${pos.map(p=>`<tr><td><span class="sym">${esc(p.symbol)}</span><span class="tag">${esc(p.kind)}</span></td>
        <td class="num">${p.shares??'—'}</td><td class="num">${p.price?Number(p.price).toFixed(2):'—'}</td>
        <td class="num">${p.value?money(p.value):'—'}</td>
        <td class="num ${cls(p.pl_pct)}">${pct(p.pl_pct)}</td>
        <td class="num hide-sm">${p.stop?Number(p.stop).toFixed(2):'—'}</td></tr>`).join('')}
        </tbody></table>` : '<p class="blank">Nothing held.</p>'}</div>`;

    const queue = pend.length ? `<div class="panel" style="margin-bottom:10px"><h2>Queued for the open</h2>
      <div class="cap">Decided from the ${esc(d.asof||'last')} close.</div>
      <table><thead><tr><th>Action</th><th>Symbol</th><th class="num">Shares</th><th class="num">Stop</th></tr></thead><tbody>
      ${pend.map(o=>`<tr><td>${o.side==='buy'?'Buy':'Sell'}</td><td class="sym">${esc(o.symbol)}</td>
      <td class="num">${o.qty??'all'}</td><td class="num">${o.stop?Number(o.stop).toFixed(2):'—'}</td></tr>`).join('')}
      </tbody></table></div>` : '';

    const cand = (d.candidates||[]);
    const watch = cand.length ? `<div class="grid2">
      <div class="panel"><h2>Momentum</h2><div class="cap">Six-month return of what passes the screen.</div>
        ${bars(cand)}</div>
      <div class="panel"><h2>Log</h2><div class="cap">Newest first.</div>
        ${(d.events||[]).slice(0,7).map(e=>`<div class="log"><time>${esc((e.t||'').replace('T',' ').slice(5,16))}</time>
          <span>${esc(e.msg)}</span></div>`).join('') || '<p class="blank">Nothing yet.</p>'}</div>
    </div>` : '';

    $('body').innerHTML = needs(d) + cards + strip + charts + posPanel + queue + watch;
    if(spy.length>1) wire($('p-spy'), spy, spySeries, 'd', {W:520,L:46,R:54,money:true});
    if(eq.length>1)  wire($('p-eq'),  eq,  SERIES,    'date', {W:520,L:46,R:54,money:true});
  }

  async function load(){
    const btn = $('refresh'), was = btn.textContent;
    btn.textContent = 'Refreshing…'; btn.disabled = true;
    try{
      const r = KEY
        ? await fetch(API + '/trading?days=120', { headers:{ Authorization:'Bearer ' + KEY }, cache:'no-store' })
        : await fetch(API + '/trading/public?days=120', { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      data = j.state;
      const t = j.state_updated ?? (data && (typeof data.updated === 'number' ? data.updated
                 : data.updated ? Date.parse(data.updated)/1000 : null));
      $('fresh').textContent = t ? ago(Date.now()/1000 - t) : '';
      render();
    }catch(e){ $('body').innerHTML = `<p class="blank">Could not load: ${esc(e.message)}</p>`; }
    finally{ btn.textContent = was; btn.disabled = false; }
  }
  $('refresh').addEventListener('click', load);
  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
</script>
</body>
</html>
