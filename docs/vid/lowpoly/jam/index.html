<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phantom Jam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#10151b; --ink:#f3ead8; --accent:#e9684a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: Oswald, system-ui, sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:10px; }
  #stage { position:relative; display:block; flex:0 1 auto; min-height:0; }
  canvas { display:block; height:100%; width:auto; max-width:100%; background:#000;
    border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #bar { display:flex; align-items:center; gap:12px; width:min(560px, 96vw);
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
    border-radius:999px; padding:8px 14px; flex:0 0 auto; }
  button { background:none; border:0; color:var(--ink); font:inherit; font-size:17px;
    cursor:pointer; padding:4px 8px; border-radius:6px; letter-spacing:.5px; }
  button:hover { background:rgba(255,255,255,.10); }
  #scrub { flex:1; accent-color:var(--accent); cursor:pointer; }
  #time { font-variant-numeric:tabular-nums; font-size:14px; opacity:.75; min-width:86px;
    text-align:right; letter-spacing:1px; }
  #note { font-size:12px; opacity:.5; letter-spacing:2px; text-transform:uppercase; flex:0 0 auto; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
  <div id="bar">
    <button id="play" title="play / pause">&#9654;</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
    <span id="time">0.0 / 0.0</span>
    <button id="snd" title="sound on / off">&#128266;</button>
    <button id="loop" title="loop" style="opacity:1">&#8635;</button>
  </div>
  <div id="note">1080 &times; 1920 &middot; low-poly &middot; phantom jam</div>
</div>

ted({ glow: 0.22 }), { cast: false });\n        m.position.set(...pos); m.scale.setScalar(s); scene.add(m); clouds.push({ m, pos, seed });\n      });\n\n      // ---------------------------------------------------------- the cars\n      const HERO = 11;                                   // the one you can follow through the queue\n      const carMesh = new THREE.InstancedMesh(carGeo(), faceted({ roughness: 0.82 }), SIM.N);\n      carMesh.castShadow = true; carMesh.receiveShadow = true; carMesh.frustumCulled = false;\n      carMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(SIM.N * 3), 3);\n      scene.add(carMesh);\n      const C_FAST = new THREE.Color(PAL.carFast), C_SLOW = new THREE.Color(PAL.carSlow), C_HERO = new THREE.Color(PAL.hero);\n      const _cc = new THREE.Color();\n\n      // ---------------------------------------------------------- flags\n      // Each flag stands just outside the ring, at the angle its idea happens at.\n      const angOf = (mt, i) => 2 * Math.PI * (((simAt(mt).x[i] % SIM.L) + SIM.L) % SIM.L) / SIM.L;\n      const BRAKE_ANG = angOf(BRAKE_MODEL_T + 0.3, 0);\n      // the angle the back of the jam reaches 1.1 s before the end -- so the wave\n      // sweeps INTO a static frame during the final seconds rather than past it\n      const TAIL_ANG = jamAngAt(Math.max(0, (T.end - 1.1 - T.ring) * MODEL_C)) - 1.15;\n      const FLAGS = [\n        // each flag stands where the camera is ALREADY looking when it pops --\n        // the aim track's angle at that moment -- or it plants itself off-frame\n        // ... but set BEYOND the aim point, not on it: planted exactly where the\n        // lens is pointed a flag fills the foreground and clips. 0.45 rad further\n        // round puts it in the middle distance, whole and readable.\n        { num: 1, word: 'THE RING',  ang: BRAKE_ANG + 1.50, t: T.flag1, side:  1 },\n        { num: 2, word: 'ONE BRAKE', ang: BRAKE_ANG + 0.40, t: T.flag2, side: -1 },\n        { num: 3, word: 'THE QUEUE', ang: BRAKE_ANG - 1.35, t: T.flag3, side:  1 },\n        { num: 4, word: 'THE WAVE',  ang: TAIL_ANG + Math.PI, t: T.flag4, side:  1 },\n      ];\n      const flags = FLAGS.map((f) => {\n        const o = flag(f.num, f.word, { side: f.side, height: 0.78 });\n        const rad = RO + 0.78, x = Math.cos(f.ang) * rad, z = Math.sin(f.ang) * rad;\n        o.group.position.set(x, height(x, z) - 0.01, z);\n        scene.add(o.group); return o;\n      });\n\n      // ---------------------------------------------------------- camera\n      // One continuous crane: alongside the traffic, in to the brake, up and out.\n      const look = (ang, rad, y) => [Math.cos(ang) * rad, y, Math.sin(ang) * rad];\n      const B = BRAKE_ANG;\n      const cam = {\n        pos: K.path([\n          [T.ring,  look(B + 2.95, RR + 4.3, 3.05)],\n          [T.flag2, look(B + 1.62, RR + 3.9, 2.80)],\n          [T.brake, look(B + 0.88, RR + 3.0, 2.25)],\n          [T.grow,  look(B + 0.18, RR + 3.8, 3.10)],\n          [T.queue, look(B - 1.05, RR + 11.9, 13.00)],\n          [T.hero,  look(B - 2.05, RR + 22.9, 26.00)],\n          [T.back,  look(B - 2.70, RR + 23.9, 27.50)],\n          [T.end,   look(B - 3.20, RR + 24.4, 28.00)],   // overridden below by the tail shot\n        ]),\n        aim: K.path([\n          [T.ring,  look(B + 2.05, RR, ROADY + 0.22)],\n          [T.flag2, look(B + 0.85, RR, ROADY + 0.26)],\n          [T.brake, look(B + 0.10, RR, ROADY + 0.22)],\n          [T.grow,  look(B - 0.55, RR, ROADY + 0.26)],\n          [T.queue, look(B - 1.35, RR * 0.45, ROADY + 0.30)],\n          [T.hero,  [0, ROADY + 0.10, 0]],\n          [T.back,  [0, ROADY + 0.05, 0]],\n          [T.end,   [0, ROADY + 0.05, 0]],\n        ]),\n        focus: K.track([\n          [T.ring,  look(B + 2.05, RR, ROADY + 0.2)],\n          [T.flag2, look(B + 0.85, RR, ROADY + 0.2)],\n          [T.brake, look(B + 0.10, RR, ROADY + 0.2)],\n          [T.grow,  look(B - 0.55, RR, ROADY + 0.2)],\n          [T.queue, loo el is no use seen from behind: turn it to the lens\n            const g = o.group, dx = camera.position.x - g.position.x, dz = camera.position.z - g.position.z;\n            g.rotation.y = Math.atan2(dx, dz);   // board faces the lens; `side` already hangs the paper\n          });\n\n          let p = cam.pos(t), a = cam.aim(t), ap = cam.ap(t), fo = cam.focus(t);\n          // the last beat: come down off the wide onto a fixed piece of road that\n          // the back of the queue sweeps through, so the wave arrives at the lens\n          const w = K.smooth(T.back - 0.3, T.back + 2.0, t);\n          if (w > 0) {\n            const px = Math.cos(TAIL_ANG) * RR, pz = Math.sin(TAIL_ANG) * RR;\n            const cp = [Math.cos(TAIL_ANG + 0.62) * (RR + 3.1), 1.75, Math.sin(TAIL_ANG + 0.62) * (RR + 3.1)];\n            const ca = [px, ROADY + 0.14, pz];\n            p = p.map((v, i) => K.lerp(v, cp[i], w));\n            a = a.map((v, i) => K.lerp(v, ca[i], w));\n            ap = K.lerp(ap, 0.016, w); fo = ca;\n          }\n          K.look(camera, p, a); K.focus(camera, fo, ap);\n          sky.position.copy(camera.position);\n        },\n\n        overlay(ctx, t, W, H) {\n          const SAFE = 96;\n          for (const l of label(t)) {\n            ctx.save(); ctx.globalAlpha = l.a;\n            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n            const y = H - SAFE - 150 + (1 - l.a) * 26;\n            ctx.font = '600 100px \"Oswald\"'; ctx.letterSpacing = '2px';\n            ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(34,48,60,0.30)'; ctx.strokeText(l.big, W / 2, y);\n            ctx.fillStyle = PAL.paper; ctx.fillText(l.big, W / 2, y);\n            ctx.font = '600 44px \"Oswald\"'; ctx.letterSpacing = '6px';\n            ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(34,48,60,0.30)'; ctx.strokeText(l.small, W / 2, y + 62);\n            ctx.fillStyle = PAL.paper; ctx.fillText(l.small, W / 2, y + 62);\n            ctx.restore();\n          }\n        },\n      };\n    },\n\n    sound(k) {\n      const r = K.rng(4);\n      // engines: a quiet bed of small motors that thins out as cars stop. Beds are\n      // dropped automatically in voiceover mode, so this is the minor layer.\n      k.withMinor(() => {\n        for (let t = 0.1; t < T.brake; t += 0.33 + r() * 0.18)\n          k.tone(t, { f: 95 + r() * 30, type: 'triangle', dur: 0.4, gain: 0.03, a: 0.12, hold: 0.15, pan: r() * 1.4 - 0.7, filter: 'lowpass', f2: 500 });\n        // tyres on the kerb as the camera runs alongside\n        for (let t = 0.2; t < T.flag2; t += 0.5 + r() * 0.3)\n          k.noise(t, { dur: 0.25, color: 'pink', filter: 'bandpass', f: 600 + r() * 400, q: 0.8, gain: 0.03, a: 0.1, pan: r() * 1.2 - 0.6 });\n      });\n      // the flags: pin in, paper round\n      [T.flag1, T.flag2, T.flag3, T.flag4].forEach((t, i) => {\n        k.play('pop', t, { gain: 0.85, f: 540 + i * 55, pan: [-0.25, 0.3, -0.2, 0][i] });\n        k.play('swish', t + 0.12, { gain: 0.45, dur: 0.2 });\n        k.play('tock', t + 0.3, { gain: 0.4, f: 700 });\n      });\n      // ONE brake, then the error running down the line: each car a little later,\n      // a little harder, which is the whole mechanism in sound\n      k.play('swish', T.brake, { gain: 0.8, dur: 0.22, pan: 0.1 });\n      k.play('tock', T.brake + 0.02, { gain: 0.5, f: 420, pan: 0.1 });\n      for (let i = 1; i <= 9; i++) {\n        const ti = T.brake + 0.16 * i * (1 + i * 0.03);\n        if (ti > T.queue) break;\n        k.withMinor(() => {\n          k.noise(ti, { dur: 0.16 + i * 0.012, color: 'pink', filter: 'bandpass', f: 900 - i * 55, q: 1.6,\n            gain: 0.10 + i * 0.016, a: 0.02, pan: K.clamp(-0.6 + i * 0.14, -1, 1) });\n          k.tone(ti, { f: [[0, 300 - i * 14], [0.18, 150 - i * 7]], dur: 0.2, gain: 0.05 + i * 0.008 });\n        });\n      }\n      k.play('thud', T.queue, { gain: 0.5, f: 78, pan: 0 });              // the queue lands\n      k.play('whoosh', T.hero - 0.15, { gain: 0.4, dur: 0.7, to const style = window.STYLES[window.STYLES.length - 1];

const cv = document.getElementById('cv');
const LIVE_SAMPLES = 3;
const S = await K.run(cv, style, { samples: LIVE_SAMPLES, width: 1080, height: 1920 });
const DURATION = style.duration;
window.DURATION = DURATION;
window.seek = (t) => S.seek(t);
window.seekFull = (t) => S.seek(t, style.render.samples);

// --- the voice. A media element fed from a blob: an <audio src> pointed straight
// at the file cannot be scrubbed reliably before it is buffered, and the render
// path needs the decoded length anyway.
let voice = null, voiceReady = false;
if (window.HAS_VOICE) {
  try {
    const blob = await (await fetch('voiceover.mp3')).blob();
    voice = new Audio(URL.createObjectURL(blob));
    voice.preload = 'auto';
    await new Promise((r) => { voice.addEventListener('loadedmetadata', r, { once: true }); setTimeout(r, 4000); });
    voiceReady = true;
  } catch (e) { console.warn('no voiceover:', e); }
}

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
const timeEl = document.getElementById('time'), sndBtn = document.getElementById('snd');
const loopBtn = document.getElementById('loop');
let t = 0, playing = false, looping = true, sound = true, stopSound = null, raf = 0, last = 0;

function fit() {
  const bar = document.getElementById('bar').getBoundingClientRect().height;
  const note = document.getElementById('note').getBoundingClientRect().height;
  document.getElementById('stage').style.height = (window.innerHeight - bar - note - 46) + 'px';
}
window.addEventListener('resize', fit); fit();

function startSound() {
  if (!sound) return;
  stopSound = SOUND.live((k) => style.sound(k), t, { voiceover: true });
  if (voiceReady) { try { voice.currentTime = Math.min(t, voice.duration || t); voice.play(); } catch (e) {} }
}
function killSound() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voiceReady) { try { voice.pause(); } catch (e) {} }
}
function draw() { S.seek(t); timeEl.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1);
  scrub.value = Math.round(1000 * t / DURATION); }
function frame(now) {
  if (!playing) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  t += dt;
  if (t >= DURATION) {
    if (looping) { t = 0; killSound(); startSound(); }
    else { t = DURATION; pause(); draw(); return; }
  }
  draw(); raf = requestAnimationFrame(frame);
}
function play() { if (playing) return; playing = true; playBtn.innerHTML = '&#10073;&#10073;';
  last = performance.now(); startSound(); raf = requestAnimationFrame(frame); }
function pause() { playing = false; playBtn.innerHTML = '&#9654;'; cancelAnimationFrame(raf); killSound(); }

playBtn.onclick = () => (playing ? pause() : play());
scrub.oninput = () => { const was = playing; if (was) pause(); t = DURATION * scrub.value / 1000; draw(); if (was) play(); };
sndBtn.onclick = () => { sound = !sound; sndBtn.style.opacity = sound ? 1 : 0.35;
  if (!sound) killSound(); else if (playing) startSound(); };
loopBtn.onclick = () => { looping = !looping; loopBtn.style.opacity = looping ? 1 : 0.35; };
window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });

draw();
window.READY = true;
</script>
</body>
</html>
