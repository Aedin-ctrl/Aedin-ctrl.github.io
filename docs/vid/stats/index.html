<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics - Cathode Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=VT323&family=Inter:wght@400;600;800&display=block">
<link rel="stylesheet" href="../desk.css?v=617de10cb0">
</head>
<body>
<div class="wrap">
<nav class="secnav">
  <span aria-current="page">ANALYTICS</span>
  <a href="../">CATHODE DESK</a>
  <a href="../mini/">MINI</a>
</nav>
<header>
  <h1>ANALYTICS</h1>
  <p class="sub">Every platform Cathode Desk posts to, side by side &mdash; whether it is working,
  when it last went out, and what it has to show for it.</p>
</header>
<style>
  .statbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
  .statbar button{font:700 11px Inter,system-ui;letter-spacing:.07em;text-transform:uppercase;
    padding:7px 13px;border-radius:7px;cursor:pointer;color:inherit;
    border:1px solid rgba(127,127,127,.5);background:rgba(127,127,127,.12)}
  .statbar button:hover:not(:disabled){background:rgba(127,127,127,.24)}
  .statbar button:disabled{opacity:.5;cursor:default}
  .statbar .age{font:400 12px Inter,system-ui;opacity:.65}
  .poster{font:400 13px/1.55 Inter,system-ui;border:1px solid rgba(127,127,127,.3);
    border-radius:9px;padding:11px 14px;margin:0 0 22px}
  .poster b{font-weight:700}

  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media(max-width:860px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:460px){.grid4{grid-template-columns:minmax(0,1fr)}}
  .con{border:1px solid rgba(127,127,127,.32);border-radius:10px;padding:14px 15px;min-width:0;
    display:flex;flex-direction:column}
  .con h3{font:800 13px Inter,system-ui;letter-spacing:.08em;text-transform:uppercase;margin:0 0 9px}
  .con .st{font:700 13px Inter,system-ui;margin:0 0 3px;display:flex;align-items:center;gap:7px}
  .con .st i{width:9px;height:9px;border-radius:50%;background:#2ea44f;flex:0 0 auto}
  .con.check{border-color:#c98b1a}
  .con.check .st{color:#c98b1a}
  .con.check .st i{background:#c98b1a}
  .con .why.warn{color:#c98b1a}
  .con .unver{font:400 10px Inter,system-ui;opacity:.55;display:block;text-align:right;margin-top:-4px}
  .con.down{border-color:#c0392b}
  .con.down .st{color:#c0392b}
  .con.down .st i{background:#c0392b}
  .con .last{font:400 12px Inter,system-ui;opacity:.6;margin:0 0 12px}
  .con .why{font:400 12px/1.45 Inter,system-ui;color:#c0392b;margin:0 0 9px}
  .con code{display:block;margin:0 0 12px;padding:7px 9px;border-radius:6px;
    background:rgba(127,127,127,.14);font:400 11px/1.4 ui-monospace,Menlo,monospace;
    overflow-x:auto;white-space:pre}
  .con dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:auto 0 0;
    border-top:1px solid rgba(127,127,127,.2);padding-top:11px}
  .con dt{font:400 12px Inter,system-ui;opacity:.65}
  .con dd{font:700 16px Inter,system-ui;margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .con .na{opacity:.3;font-weight:400}
  .foot{font:400 11px/1.4 Inter,system-ui;opacity:.5;margin:11px 0 0}

  table.an{width:100%;border-collapse:collapse;font:400 13px Inter,system-ui}
  table.an th{text-align:right;font:800 11px Inter,system-ui;letter-spacing:.06em;text-transform:uppercase;opacity:.65;padding:6px 8px;border-bottom:1px solid rgba(127,127,127,.35)}
  table.an th:first-child,table.an td:first-child{text-align:left}
  table.an td{padding:6px 8px;border-bottom:1px solid rgba(127,127,127,.15);text-align:right;font-variant-numeric:tabular-nums}
  table.an td.t{text-align:left;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.an td.na{opacity:.35}
  .wrapx{overflow-x:auto}
</style>

<section>
  <h2>CONNECTORS</h2>
  <div class="statbar">
    <button id="refresh" type="button">Check for new numbers</button>
    <span class="age" id="age"></span>
  </div>
  <div class="poster" id="poster">loading&hellip;</div>
  <div class="grid4" id="cons"></div>
  <p class="foot" id="foot"></p>
</section>

<section>
  <h2>EVERY PIECE</h2>
  <div class="wrapx"><table class="an" id="tbl"></table></div>
  <p class="foot" id="tnote"></p>
</section>
</div>
<script>
const PLATS=[['youtube','YouTube'],['facebook','Facebook'],['instagram','Instagram'],['tiktok','TikTok']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v).toLocaleString();
// "not reported" and "zero" are different answers, and on a page about whether
// anyone is watching they are opposite claims. A dash is never a 0.
const fmt=v=>v==null?'<span class="na">&mdash;</span>':n(v);
const day=t=>t?new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'}):null;
const norm=s=>String(s||'').toLowerCase().replace(/[‘’“”]/g,"'").replace(/#[a-z0-9_]+/g,' ').replace(/[^a-z0-9]+/g,' ').trim();

// The button cannot collect anything: these APIs need a secret and refuse a
// browser origin, so collection happens on the Mac (hourly) and this re-reads
// what it published.
let COLLECTED=null;
function ago(t){
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<90) return 'just now';
  if(s<5400) return Math.round(s/60)+' minutes ago';
  if(s<172800) return Math.round(s/3600)+' hours ago';
  return Math.round(s/86400)+' days ago';
}
function tick(){
  if(!COLLECTED) return;
  const stale=(Date.now()-COLLECTED)>3*3600*1000;
  document.getElementById('age').innerHTML='collected '+ago(COLLECTED)
    +(stale?' — <b>the hourly collector may have stopped</b>':'');
}
setInterval(tick,30000);

function render(d){
  COLLECTED=new Date(d.generated).getTime(); tick();

  const pipe=d.pipeline||{};
  document.getElementById('poster').innerHTML=
    (pipe.armed?'<b>Posting nightly at '+String(pipe.hour==null?18:pipe.hour).padStart(2,'0')+':00.</b>'
               :'<b style="color:#c0392b">Nothing is scheduled.</b> Nobody is posting.')
    +(pipe.lastRun?' Last run '+esc(pipe.lastRun)+' — '+esc(pipe.lastResult||'')
                  :' It has not run yet.');

  document.getElementById('cons').innerHTML=PLATS.map(([k,label])=>{
    const p=d.platforms[k]||{status:'down',statusText:'Not collected',sent:null};
    const down=p.status==='down';
    const check=p.status==='check';
    const led=d.ledger&&d.ledger[k];
    return '<div class="con '+(down?'down':check?'check':'ok')+'">'
      +'<h3>'+label+'</h3>'
      +'<p class="st"><i></i>'+esc(p.statusText||(down?'Not connected':'Working'))+'</p>'
      +(down||check
        ? '<p class="why'+(check?' warn':'')+'">'+esc(p.statusWhy||'Uploads are not going through.')
            +(down&&led&&led.owed?' '+led.owed+' waiting.':'')+'</p>'
          +(p.fix?'<code>'+esc(p.fix)+'</code>':'')
        : '<p class="last">last posted '+(day(p.lastPosted)||'—')+'</p>')
      +'<dl><dt>videos live</dt><dd>'+fmt(p.sent)
      +(p.sentVerified===false?'<span class="unver">from the ledger, unchecked</span>':'')+'</dd>'
      +'<dt>views</dt><dd>'+fmt(p.views)+'</dd>'
      +'<dt>followers</dt><dd>'+fmt(p.followers)+'</dd></dl>'
      +'</div>';
  }).join('');

  const missing=PLATS.filter(([k])=>{const p=d.platforms[k];return p&&p.status==='ok'&&p.views==null;})
                     .map(([,l])=>l);
  document.getElementById('foot').textContent=
    d.library+' pieces in the library, '+(d.approved!=null?d.approved:d.library)+' cleared to post.'
    +(missing.length?' '+missing.join(' and ')+' will not report view counts — a dash means not reported, which is not zero.':'');

  // One row per piece, matched across platforms on the normalised title. Every
  // title comes from the same upload sheet, so this is exact after normalising.
  const by=new Map();
  for(const [k] of PLATS){
    const p=d.platforms[k]; if(!p||!p.ok) continue;
    for(const v of p.videos||[]){
      const key=norm(v.title); if(!key) continue;
      if(!by.has(key)) by.set(key,{title:v.title,when:v.when,per:{}});
      const row=by.get(key); row.per[k]=v;
      if(v.when&&(!row.when||v.when<row.when)) row.when=v.when;
    }
  }
  const live=PLATS.filter(([k])=>d.platforms[k]&&d.platforms[k].ok);
  const rows=[...by.values()].sort((a,b)=>String(b.when||'').localeCompare(String(a.when||'')));
  document.getElementById('tbl').innerHTML=
    '<thead><tr><th>piece</th><th>first posted</th>'
    +live.map(([,l])=>'<th>'+l+'</th>').join('')+'<th>likes</th></tr></thead><tbody>'
    +rows.map(r=>{
      let likes=null;
      for(const [k] of live){const v=r.per[k]; if(v&&v.likes!=null) likes=(likes||0)+v.likes;}
      const first=live.map(([k])=>r.per[k]).find(v=>v&&v.url);
      return '<tr><td class="t" title="'+esc(r.title)+'">'
        +(first?'<a href="'+esc(first.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>':esc(r.title))
        +'</td><td>'+(r.when?new Date(r.when).toLocaleDateString():'—')+'</td>'
        +live.map(([k])=>'<td'+(r.per[k]&&r.per[k].views!=null?'':' class="na"')+'>'
            +(r.per[k]&&r.per[k].views!=null?n(r.per[k].views):'—')+'</td>').join('')
        +'<td'+(likes==null?' class="na"':'')+'>'+(likes==null?'—':n(likes))+'</td></tr>';
    }).join('')+'</tbody>';
  document.getElementById('tnote').textContent=
    rows.length+' pieces across '+live.length+' reporting platform'+(live.length===1?'':'s')+'.';
}

function load(){
  const b=document.getElementById('refresh');
  if(b){b.disabled=true;b.textContent='checking…';}
  // Cache-bust as well as no-store: Pages serves assets with a long max-age and
  // a button that returns the cached copy is worse than no button at all.
  return fetch('../stats.json?t='+Date.now(),{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('stats.json '+r.status); return r.json();})
    .then(render)
    .catch(e=>{
      document.getElementById('poster').textContent='could not load stats.json — '+e.message;
      document.getElementById('foot').textContent='Run: node stats.mjs  (in ~/Desktop/Video/publish)';
    })
    .finally(()=>{const b=document.getElementById('refresh');
      if(b){b.disabled=false;b.textContent='Check for new numbers';}});
}
document.getElementById('refresh').addEventListener('click',load);
load();
</script>
</body>
</html>
