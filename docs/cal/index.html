<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal Tracker</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('../fonts/Inter-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');}
  :root{ --paper:#fff; --ink:#101114; --muted:#6b7280; --faint:#6f747c; --line:#e6e7eb; --good:#1f9d55; --over:#c92a2a; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper); line-height:1.5;}
  main{max-width:760px; margin:0 auto; padding:28px 20px 48px;}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em; margin:0; font-size:26px;}
  .sub{color:var(--muted); font-size:14px; margin:4px 0 0;}
  section{margin-top:22px;}
  .card{border:1px solid var(--line); border-radius:12px; padding:18px;}
  label{font-size:13px; font-weight:600; display:block; margin-bottom:5px;}
  input, select{font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; color:var(--ink); background:var(--paper);}
  input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .row{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; align-items:start;}
  @media (max-width:600px){ .row{grid-template-columns:1fr;} }
  .food{position:relative;}
  #list{position:absolute; top:100%; left:0; right:0; z-index:10; background:var(--paper); border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; box-shadow:0 6px 18px rgba(0,0,0,.08);}
  #list:empty{display:none;}
  #list button{display:block; width:100%; text-align:left; border:none; background:none; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; color:var(--ink);}
  #list button:hover, #list button.active{background:#f3f4f6;}
  .hint{color:var(--faint); font-size:12.5px; margin-top:4px; min-height:1em;}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px;}
  .btn{background:var(--ink); color:var(--paper); border:none; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer;}
  .btn.secondary{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn:disabled{opacity:.45; cursor:default;}
  .result{font-size:15px;}
  .result b{font-family:'Space Grotesk',sans-serif; font-size:18px;}
  .error{color:var(--over); font-size:13px; min-height:1em; margin-top:8px;}
  .total{display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap;}
  .big{font-family:'Space Grotesk',sans-serif; font-size:40px; font-weight:700; line-height:1;}
  .bar{height:10px; background:#f1f2f4; border-radius:999px; overflow:hidden; margin-top:12px;}
  .bar span{display:block; height:100%; background:var(--good); border-radius:999px; transition:width .3s;}
  .muted{color:var(--muted); font-size:13px;}
  ul.log{list-style:none; padding:0; margin:12px 0 0; font-size:13.5px;}
  ul.log li{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line);}
  ul.log li span:last-child{color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<main>
  <h1>Cal Tracker</h1>
  <p class="sub">Look up a food by portion or weight, add it to today's log, and keep a running calorie and protein total for each person.</p>

  <section class="card">
    <div style="max-width:240px">
      <label for="person">Tracking for</label>
      <select id="person"></select>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="food">
        <label for="food">Food / meal</label>
        <input type="text" id="food" placeholder="e.g. grilled chicken breast, avocado" autocomplete="off" role="combobox" aria-controls="list" aria-expanded="false">
        <div id="list" role="listbox"></div>
        <div class="hint" id="servingDesc"></div>
      </div>
      <div>
        <label for="portions">Portions</label>
        <select id="portions">
          <option value="">Select</option>
          <option value="0.5">0.5 serving</option>
          <option value="1">1 serving</option>
          <option value="2">2 servings</option>
          <option value="custom">Custom</option>
        </select>
        <input type="number" id="customPortions" placeholder="e.g. 1.5" step="0.1" min="0" style="display:none; margin-top:6px" aria-label="Custom portions">
      </div>
      <div>
        <label for="weight">Weight (g)</label>
        <input type="number" id="weight" placeholder="e.g. 150" min="0" step="1">
        <div class="hint">Used if no portion is picked</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn secondary" id="calculate">Calculate</button>
      <div class="result" id="result" aria-live="polite"></div>
      <button type="button" class="btn" id="add" disabled>Add to today's log</button>
    </div>
    <div class="error" id="error" role="alert"></div>
  </section>

  <section class="card" aria-live="polite">
    <div class="total">
      <div><div class="big" id="totalCal">0</div><div class="muted">of <span id="goal">2200</span> kcal today</div></div>
      <div><div class="big" id="totalProtein" style="font-size:28px">0 g</div><div class="muted">protein</div></div>
    </div>
    <div class="bar"><span id="bar" style="width:0%"></span></div>
    <ul class="log" id="log"></ul>
    <div class="actions">
      <button type="button" class="btn secondary" id="reset">Reset today</button>
      <span class="muted">Totals reset on their own at 4 AM. They're saved in this browser.</span>
    </div>
  </section>
</main>

<script>
(() => {
  // Same people and foods as the original Flask version (web_site_data.py).
  const PEOPLE = ['Person', 'Aedin', 'Sammy', 'Jake', 'James', 'Terp', 'Brady', 'Guest1', 'Guest2', 'Guest3'];
  const FOODS = [
    { name: 'Grilled Chicken Breast', serving: '100 g', calServing: 165, proteinServing: 31, cal100: 165, protein100: 31 },
    { name: 'Avocado', serving: '1 medium', calServing: 234, proteinServing: 2.9, cal100: 160, protein100: 2 },
    { name: 'Banana', serving: '1 medium', calServing: 105, proteinServing: 1.3, cal100: 89, protein100: 1.1 },
    { name: 'Egg', serving: '1 large', calServing: 78, proteinServing: 6.3, cal100: 155, protein100: 12.6 },
    { name: 'Broccoli', serving: '1 cup', calServing: 55, proteinServing: 3.7, cal100: 34, protein100: 2.8 },
    { name: 'Salmon', serving: '100 g', calServing: 206, proteinServing: 22, cal100: 206, protein100: 22 },
    { name: 'Apple', serving: '1 medium', calServing: 95, proteinServing: 0.5, cal100: 52, protein100: 0.3 },
    { name: 'Rice', serving: '1 cup cooked', calServing: 205, proteinServing: 4.3, cal100: 130, protein100: 2.7 },
    { name: 'Almonds', serving: '1 oz', calServing: 164, proteinServing: 6, cal100: 579, protein100: 21.2 },
    { name: 'Spinach', serving: '1 cup', calServing: 7, proteinServing: 0.9, cal100: 23, protein100: 2.9 },
  ];
  const GOAL = 2200;
  const RESET_HOUR = 4;   // a "day" runs 4 AM to 4 AM, local time

  const $ = id => document.getElementById(id);
  const round1 = v => Math.round(v * 10) / 10;
  const store = {
    get(k, fallback){ try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // The day this moment belongs to (before 4 AM counts as the previous day).
  function dayKey(date = new Date()){
    const d = new Date(date.getTime() - RESET_HOUR * 3600000);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function loadLog(person){
    const saved = store.get('calTracker:' + person, null);
    return saved && saved.day === dayKey() ? saved : { day: dayKey(), items: [] };
  }
  function saveLog(person, log){ store.set('calTracker:' + person, log); }

  let person = store.get('calTracker:person', 'Person');
  if(!PEOPLE.includes(person)) person = 'Person';
  let pending = null;   // last calculated {food, calories, protein, detail}

  $('person').innerHTML = PEOPLE.map(p => `<option>${p}</option>`).join('');
  $('person').value = person;
  $('person').addEventListener('change', () => { person = $('person').value; store.set('calTracker:person', person); renderTotals(); });
  $('goal').textContent = GOAL.toLocaleString();

  // ---- food search -------------------------------------------------------
  const findFood = name => FOODS.find(f => f.name.toLowerCase() === name.trim().toLowerCase());
  let activeIndex = -1;
  function showList(query){
    const q = query.trim().toLowerCase();
    const matches = FOODS.filter(f => !q || f.name.toLowerCase().includes(q));
    activeIndex = -1;
    $('list').replaceChildren(...matches.map(f => {
      const b = document.createElement('button');
      b.type = 'button'; b.role = 'option'; b.textContent = f.name;
      b.addEventListener('mousedown', e => { e.preventDefault(); pickFood(f); });
      return b;
    }));
    $('food').setAttribute('aria-expanded', String(matches.length > 0));
  }
  function hideList(){ $('list').replaceChildren(); $('food').setAttribute('aria-expanded', 'false'); }
  function pickFood(f){
    $('food').value = f.name;
    $('servingDesc').textContent = '1 serving = ' + f.serving;
    hideList(); invalidate();
  }
  $('food').addEventListener('focus', () => showList($('food').value));
  $('food').addEventListener('input', () => {
    const f = findFood($('food').value);
    $('servingDesc').textContent = f ? '1 serving = ' + f.serving : '';
    showList($('food').value); invalidate();
  });
  $('food').addEventListener('blur', () => setTimeout(hideList, 100));
  $('food').addEventListener('keydown', e => {
    const items = [...$('list').children];
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if(!items.length) return;
      e.preventDefault();
      activeIndex = (activeIndex + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((b, i) => b.classList.toggle('active', i === activeIndex));
    } else if(e.key === 'Enter'){
      e.preventDefault();
      const pick = items[activeIndex] || (items.length === 1 ? items[0] : null);
      if(pick) pickFood(findFood(pick.textContent)); else calculate();
    } else if(e.key === 'Escape'){ hideList(); }
  });

  // ---- portions / weight -------------------------------------------------
  $('portions').addEventListener('change', () => {
    const custom = $('portions').value === 'custom';
    $('customPortions').style.display = custom ? '' : 'none';
    if(!custom) $('customPortions').value = '';
    invalidate();
  });
  ['customPortions', 'weight'].forEach(id => $(id).addEventListener('input', invalidate));

  function invalidate(){ pending = null; $('add').disabled = true; $('result').textContent = ''; $('error').textContent = ''; }

  // Portions take priority over weight, as in the original.
  function calculate(){
    $('error').textContent = '';
    const food = findFood($('food').value);
    if(!food){ $('error').textContent = $('food').value.trim() ? 'Pick a food from the list.' : 'Enter a food.'; return; }
    let portions = $('portions').value === 'custom' ? $('customPortions').value : $('portions').value;
    const weight = $('weight').value;
    let calories, protein, detail;
    if(portions !== ''){
      const n = parseFloat(portions);
      if(!(n > 0) || n > 50){ $('error').textContent = 'Enter a portion amount above 0.'; return; }
      calories = food.calServing * n; protein = food.proteinServing * n;
      detail = `${n} × ${food.serving}`;
    } else if(weight !== ''){
      const g = parseFloat(weight);
      if(!(g > 0) || g > 5000){ $('error').textContent = 'Enter a weight above 0 g.'; return; }
      calories = food.cal100 / 100 * g; protein = food.protein100 / 100 * g;
      detail = `${g} g`;
    } else {
      $('error').textContent = 'Enter portions or weight.'; return;
    }
    pending = { food: food.name, detail, calories: round1(calories), protein: round1(protein) };
    $('result').innerHTML = '<b></b> kcal · <b></b> g protein';
    $('result').children[0].textContent = pending.calories;
    $('result').children[1].textContent = pending.protein;
    $('add').disabled = false;
  }
  $('calculate').addEventListener('click', calculate);

  // ---- log ---------------------------------------------------------------
  $('add').addEventListener('click', () => {
    if(!pending) return;
    const log = loadLog(person);
    log.items.push({ ...pending, at: Date.now() });
    saveLog(person, log);
    $('food').value = ''; $('servingDesc').textContent = ''; $('weight').value = '';
    $('portions').value = ''; $('customPortions').value = ''; $('customPortions').style.display = 'none';
    invalidate(); renderTotals();
  });
  $('reset').addEventListener('click', () => { saveLog(person, { day: dayKey(), items: [] }); renderTotals(); });

  function renderTotals(){
    const log = loadLog(person);
    const cal = round1(log.items.reduce((s, x) => s + x.calories, 0));
    const pro = round1(log.items.reduce((s, x) => s + x.protein, 0));
    $('totalCal').textContent = cal.toLocaleString();
    $('totalCal').style.color = cal > GOAL ? 'var(--over)' : '';
    $('totalProtein').textContent = pro + ' g';
    $('bar').style.width = Math.min(100, cal / GOAL * 100) + '%';
    $('bar').style.background = cal > GOAL ? 'var(--over)' : '';
    $('log').replaceChildren(...log.items.map(x => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span></span>';
      li.children[0].textContent = `${x.food} (${x.detail})`;
      li.children[1].textContent = `${x.calories} kcal · ${x.protein} g`;
      return li;
    }));
  }
  renderTotals();
  // Roll over at 4 AM even if the page stays open.
  setInterval(renderTotals, 60000);
})();
</script>
</body>
</html>
