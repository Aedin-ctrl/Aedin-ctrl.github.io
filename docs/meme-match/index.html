<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Privacy: connect-src 'self' blocks MediaPipe's usage-stats POST to odml.pa.googleapis.com
       (Hand Playground research/10). Camera frames never leave the page. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MemeMatch</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="top">
    <nav class="tabs" id="tabs"></nav>
    <div class="top-right">
      <button id="train" title="Copy each one for a few seconds so it learns your face (T)">Train on your face</button>
      <button id="usePersonal" hidden title="Switch between your training and the defaults">Using your training</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <video id="feed" autoplay muted playsinline></video>
      <canvas id="you"></canvas>
      <div class="stage-label">You</div>
      <div id="nudge" class="nudge"></div>
    </section>

    <section class="side" id="side">
      <div class="meme-card" id="memeCard">
        <canvas id="meme"></canvas>
        <div class="meme-empty" id="memeEmpty">
          <div><div class="big" id="emptyBig">Make a face</div><div id="emptySub">Loading…</div></div>
        </div>
        <div class="meme-head" id="memeHead" hidden>
          <div class="meme-title" id="memeTitle"></div>
          <div class="meme-score" id="memeScore"></div>
        </div>
        <a class="meme-credit" id="memeCredit" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="readout" id="readout">
        <div class="parts" id="parts"></div>
        <div class="hint" id="hint"></div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="trainer" id="trainer" hidden>
        <div class="trainer-top"><span id="trainStep"></span><button id="trainStop">Stop</button></div>
        <div class="trainer-pic"><img id="trainImg" alt=""></div>
        <div class="trainer-title" id="trainTitle"></div>
        <div class="trainer-cue" id="trainCue"></div>
        <div class="trainer-bar"><b id="trainBar"></b></div>
        <div class="trainer-result" id="trainResult" hidden>
          <div id="trainSummary"></div>
          <div class="row">
            <button id="trainDone">Done</button>
            <button id="trainAgain">Train again</button>
            <button id="trainSaveDefault" hidden title="Write these templates into memes/*.json (dev server only)">Save as the defaults</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="bar">
    <div id="status" class="chip status">Starting camera…</div>
    <button id="retry" hidden>Try again</button>
    <button id="masks" title="Show or hide the masks on you and on the meme (M)">Hide masks</button>
    <button id="cam" title="Show or hide the camera picture (C)">Hide camera</button>
    <button id="debug" title="Tracking details (D)">Details</button>
  </div>

  <pre id="hud" class="hud" hidden></pre>
</body>
</html>
