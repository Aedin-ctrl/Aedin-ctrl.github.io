<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Terminal</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('../fonts/Inter-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');}
  :root{
    --paper:#ffffff; --ink:#101114; --muted:#6b7280; --faint:#6f747c;
    --line:#e6e7eb; --line-strong:#16171b; --wash:#f6f6f7;
    --ok:#1f9d55; --warn:#c98a06; --bad:#c92a2a; --off:#b8bcc4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper); line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px;}

  main{max-width:980px; margin:0 auto; padding:32px clamp(16px,4vw,48px) 56px;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin:0 0 24px;}
  .head h1{font-size:22px;}
  .head p{color:var(--muted); font-size:14px; margin-top:4px;}
  .fresh{font-size:12.5px; color:var(--faint); display:flex; align-items:center; gap:10px;}
  .fresh button{font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--faint);}

  .dot{width:9px; height:9px; border-radius:50%; background:var(--off); flex-shrink:0; display:inline-block;}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(31,157,85,.14);}
  .dot.warn{background:var(--warn);}
  .dot.bad{background:var(--bad);}

  .m{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; transition:border-color .15s ease;}
  .m:hover{border-color:var(--line-strong);}
  .m-row{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:18px 20px;}
  .m-name{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;}
  .m-host{font-size:13px; color:var(--muted); margin-top:1px; overflow-wrap:anywhere;}
  .m-state{font-size:13px; white-space:nowrap; text-align:right; color:var(--faint);}
  .open{display:inline-block; font-size:13.5px; font-weight:600; padding:9px 16px;
        border:1px solid var(--line-strong); border-radius:999px; text-decoration:none;
        transition:background .15s ease, color .15s ease;}
  .open:hover{background:var(--ink); color:var(--paper);}
  .open[aria-disabled="true"]{opacity:.4; pointer-events:none;}

  .note{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px;
        padding:14px 16px; margin:22px 0 0; font-size:13.5px; color:var(--muted);}
  .note b{color:var(--ink);}

  details.setup{margin-top:26px; border-top:1px solid var(--line); padding-top:18px;}
  details.setup summary{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
                        cursor:pointer; list-style:none;}
  details.setup summary::-webkit-details-marker{display:none;}
  details.setup summary::before{content:'+ '; color:var(--faint);}
  details.setup[open] summary::before{content:'\2212 ';}
  details.setup h3{font-size:14px; margin:18px 0 6px;}
  details.setup p{font-size:13.5px; color:var(--muted); margin:0 0 8px;}
  code{font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12.5px;
       background:var(--wash); border:1px solid var(--line); border-radius:6px;
       padding:2px 6px; overflow-wrap:anywhere;}
  pre{background:var(--wash); border:1px solid var(--line); border-radius:8px;
      padding:12px 14px; overflow-x:auto; margin:0 0 10px;}
  pre code{background:none; border:none; padding:0; font-size:12.5px; line-height:1.7;}
  .kb{font-size:13.5px; color:var(--muted); margin:0 0 4px;}
  .kb kbd{font-family:ui-monospace,monospace; font-size:12px; background:var(--wash);
          border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 5px;}

  /* The gate. Everything that names the tailnet is ciphertext in #herdrCipher; the key is
     the word left sitting in the box plus the three window lights, in order. Enter is the
     decoy -- it never unlocks and never clears what was typed. */
  .g-ask{font-size:13.5px; color:var(--muted); margin:0 0 10px;}
  .g-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .g-row input{flex:1 1 200px; min-width:0; font-family:inherit; font-size:14px; color:var(--ink);
               background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
  .g-row input:focus{outline:none; border-color:var(--line-strong);}
  .g-enter{font-size:13.5px; font-weight:600; padding:9px 16px; border:1px solid var(--line-strong);
           border-radius:999px; transition:background .15s ease, color .15s ease;}
  .g-enter:hover{background:var(--ink); color:var(--paper);}
  .g-msg{font-size:13px; min-height:20px; margin-top:8px; color:var(--bad);}
  .g-lights{display:flex; gap:9px; margin:6px 0 0;}
  .g-light{width:15px; height:15px; border-radius:50%; border:1px solid rgba(0,0,0,.18); padding:0;
           transition:transform .1s ease;}
  .g-light:active{transform:scale(.88);}
  .g-light[data-c="red"]{background:#ff5f57; border-color:#e0443e;}
  .g-light[data-c="yellow"]{background:#febc2e; border-color:#dea123;}
  .g-light[data-c="green"]{background:#28c840; border-color:#1aab29;}
  .g-eye{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
         border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:0;
         cursor:pointer; flex:0 0 auto; color:var(--ink); opacity:.65;}
  .g-eye:hover{opacity:1; border-color:var(--line-strong);}
  .g-eye svg{width:17px; height:17px; display:block;}
  .g-eye .eye-off{display:none;}
  .g-eye[aria-pressed="true"] .eye-on{display:none;}
  .g-eye[aria-pressed="true"] .eye-off{display:block;}
  .gate{border:1px solid var(--line); border-radius:12px; padding:18px 20px 20px; max-width:460px;}
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Terminal</h1>
      <p>Claude Code and the other agents, from anywhere on the tailnet.</p>
    </div>
  </div>

  <div class="gate" id="gate">
    <p class="g-ask">Enter the password.</p>
    <div class="g-row">
      <input id="pw" type="password" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" aria-label="Password" aria-describedby="msg">
      <button type="button" class="g-eye" id="eye" aria-pressed="false" aria-label="Show password" title="Show password"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 12s3.6-7 10.2-7 10.2 7 10.2 7-3.6 7-10.2 7S1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A9.9 9.9 0 0 1 12 5c6.6 0 10.2 7 10.2 7a18 18 0 0 1-3.3 4.2M6.3 6.4A18 18 0 0 0 1.8 12s3.6 7 10.2 7a9.8 9.8 0 0 0 4.3-1M3 3l18 18"/></svg></button>
      <button type="button" class="g-enter" id="go">Enter</button>
    </div>
    <div class="g-msg" id="msg" role="status" aria-live="polite"></div>
    <div class="g-lights" id="lights" role="group" aria-label="Window buttons">
      <button type="button" class="g-light" data-c="red" aria-label="Red"></button>
      <button type="button" class="g-light" data-c="yellow" aria-label="Yellow"></button>
      <button type="button" class="g-light" data-c="green" aria-label="Green"></button>
    </div>
  </div>

  <div id="out"></div>
</main>

// Pressing Enter cannot unlock anything: the word is only half the key, and nothing can be
// checked until the light sequence completes. So Enter is treated as a failed attempt and
// RESETS the gate -- box cleared, sequence cleared. (Asked for 2026-10-04. It used to say
// "Wrong password." and keep the text, which read as a bug: you had typed the right word
// and it told you it was wrong.)
//
// A completed-but-wrong light sequence resets the same way. That reveals only that an
// attempt failed, which the absence of content already showed; it still never says WHICH
// half was wrong, because a gate that does can be searched half at a time.
(function(){
  const box   = JSON.parse(document.getElementById('herdrCipher').textContent);
  const gate  = document.getElementById('gate');
  const input = document.getElementById('pw');
  const msg   = document.getElementById('msg');
  const out   = document.getElementById('out');
  let seq = [], unlocked = false, trying = false;

  const unb64 = s => {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  };

  // Must match secretFor() in scripts/herdr-gate.mjs.
  async function tryOpen(word, lights){
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(word.trim().toLowerCase() + '\n' + lights.join(' ')),
      'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', hash:'SHA-256', salt: unb64(box.salt), iterations: box.iter }, base, 256);
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const pt  = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
    return new TextDecoder().decode(pt);
  }

  async function light(colour){
    if(unlocked || trying) return;
    seq.push(colour);
    if(seq.length < box.n) return;   // an attempt is exactly box.n clicks; a failure resets
    trying = true;
    try {
      const html = await tryOpen(input.value, seq);
      unlocked = true;
      gate.hidden = true;
      out.innerHTML = html;
    } catch(e){ wrong(); }      // a completed attempt that failed: reset and say so
    trying = false;
  }

  function wrong(){
    seq = [];
    input.value = '';
    msg.textContent = 'Wrong password.';
    input.focus();
  }

  const eye = document.getElementById('eye');
  eye.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.title = show ? 'Hide password' : 'Show password';
    input.focus();
  });

  document.getElementById('go').addEventListener('click', wrong);
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); wrong(); } });
  input.addEventListener('input', () => { msg.textContent = ''; });
  document.querySelectorAll('#lights .g-light').forEach(b =>
    b.addEventListener('click', () => light(b.dataset.c)));
  input.focus();
})();
</script>
</body>
</html>
