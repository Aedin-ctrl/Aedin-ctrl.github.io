<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Devices</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('../fonts/Inter-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');}
  :root{
    --paper:#ffffff; --ink:#101114; --muted:#6b7280; --faint:#6f747c;
    --line:#e6e7eb; --line-strong:#16171b; --wash:#f6f6f7;
    --ok:#1f9d55; --warn:#c98a06; --bad:#c92a2a; --off:#b8bcc4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper); line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px;}

  main{max-width:980px; margin:0 auto; padding:32px clamp(16px,4vw,48px) 56px;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin:0 0 24px;}
  .head h1{font-size:22px;}
  .head p{color:var(--muted); font-size:14px; margin-top:4px;}
  .fresh{font-size:12.5px; color:var(--faint); display:flex; align-items:center; gap:10px;}
  .fresh button{font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--faint);}

  .dot{width:9px; height:9px; border-radius:50%; background:var(--off); flex-shrink:0; display:inline-block;}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(31,157,85,.14);}
  .dot.warn{background:var(--warn);}
  .dot.bad{background:var(--bad);}

  /* One row per device; click to open everything running on it. */
  /* The on/off switch. Turning it off stops the feed and the screen, and hides the Trends tab;
     the Pi notices within a minute, so the label says so rather than looking stuck. */
  .sw{display:flex; align-items:center; justify-content:space-between; gap:16px;
      border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:0 0 16px;}
  .sw-name{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;}
  .sw-what{font-size:13px; color:var(--muted); margin-top:1px;}
  .sw-toggle{flex-shrink:0; width:52px; height:30px; border-radius:999px; background:var(--off);
             position:relative; transition:background .18s ease; cursor:pointer;}
  .sw-toggle[aria-checked="true"]{background:var(--ok);}
  .sw-toggle[disabled]{opacity:.55; cursor:default;}
  .sw-knob{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
           background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .18s ease;}
  .sw-toggle[aria-checked="true"] .sw-knob{transform:translateX(22px);}
  /* herdr gate. The link is not in this file in the clear -- #herdrCipher is AES-GCM and
     the key is the word left sitting in the box plus the traffic lights, in order.
     Pressing Enter is the decoy: it never unlocks and never clears what was typed. */
  #herdrCard .dev-name, #herdrCard .dev-what{display:block;}
  .g-locked{color:var(--faint); font-size:13.5px; margin:0;}
  .gate-body{display:none; border-top:1px solid var(--line); padding:18px 20px 20px;}
  .dev.open .gate-body{display:block;}
  .g-out p{font-size:13.5px; color:var(--muted); margin:0 0 12px;}
  .g-out .open{display:inline-block; font-size:13.5px; font-weight:600; padding:9px 16px; color:inherit;
               border:1px solid var(--line-strong); border-radius:999px; text-decoration:none;
               transition:background .15s ease, color .15s ease;}
  .g-out .open:hover{background:var(--ink); color:var(--paper);}
  .g-url{font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--faint);
         margin:12px 0 0; overflow-wrap:anywhere;}
  .dev{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; transition:border-color .15s ease;}
  .dev:hover, .dev.open{border-color:var(--line-strong);}
  .dev-sum{width:100%; display:grid; grid-template-columns:auto 1fr auto auto; gap:14px; align-items:center; padding:18px 20px; text-align:left;}
  .dev-name{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;}
  .dev-what{font-size:13px; color:var(--muted); margin-top:1px; overflow-wrap:anywhere;}
  .dev-state{font-size:13px; color:var(--ink); white-space:nowrap; text-align:right;}
  .dev-state small{display:block; color:var(--faint); font-size:12px;}
  .toggle{color:var(--faint); font-size:18px; width:18px; text-align:center;}
  .toggle::before{content:'+';}
  .dev.open .toggle::before{content:'\2212';}
  .dev-body{display:none; border-top:1px solid var(--line); padding:18px 20px 20px;}
  .dev.open .dev-body{display:block;}

  .stats{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,130px),1fr)); gap:10px;}
  .stat{background:var(--wash); border-radius:9px; padding:10px 12px;}
  .stat b{display:block; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint);}
  .bar{height:4px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--ink); border-radius:3px;}

  .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:22px 0 8px;}
  .things{border-top:1px solid var(--line);}
  .thing{display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line);}
  .thing .dot{align-self:center;}
  .t-name{font-size:14.5px; font-weight:500; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .kind{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:400;}
  .t-status{font-size:12.5px; white-space:nowrap; text-align:right;}
  .t-status.ok{color:var(--ok);} .t-status.warn{color:var(--warn);} .t-status.bad{color:var(--bad);} .t-status.off{color:var(--faint);}
  .t-detail{grid-column:2 / -1; font-size:12px; color:var(--faint); font-family:ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap:anywhere;}
  .t-check{grid-column:2 / -1; font-size:12.5px; color:var(--muted);}
  .t-check.bad{color:var(--bad);}
  .t-meta{grid-column:2 / -1; font-size:12px; color:var(--muted);}
  .hint{font-size:12.5px; color:var(--faint); margin-top:14px; line-height:1.6;}
  .hint code{font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--muted);}
  .empty{color:var(--muted); font-size:14px; padding:48px 0; text-align:center;}
  .empty small{display:block; color:var(--faint); font-size:12.5px; margin-top:6px;}

  @media (max-width:560px){
    .dev-sum{grid-template-columns:auto 1fr auto; padding:16px;}
    .dev-state{grid-column:2 / 3; text-align:left;}
    .toggle{grid-row:1; grid-column:3;}
    .dev-body{padding:16px;}
    .thing{grid-template-columns:auto 1fr;}
    .t-status{grid-column:2; text-align:left;}
  }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Devices</h1>
      <p>What's connected, and what's running on it.</p>
    </div>
    <div class="fresh"><span id="fresh"></span><button type="button" id="refresh">Refresh</button></div>
  </div>
  <div class="sw" id="swCard" hidden>
    <div class="sw-text">
      <div class="sw-name">Trend Scout</div>
      <div class="sw-what" id="swWhat">the news feed on the television</div>
    </div>
    <button type="button" class="sw-toggle" id="swToggle" role="switch" aria-checked="false" aria-label="Trend Scout on or off">
      <span class="sw-knob"></span>
    </button>
  </div>

  <section class="dev" id="herdrCard">
    <button type="button" class="dev-sum" id="herdrSum" aria-expanded="false" aria-controls="herdrBody">
      <span class="dot" id="herdrDot"></span>
      <span>
        <span class="dev-name">herdr</span>
        <span class="dev-what">the terminal, from anywhere on the tailnet</span>
      </span>
      <span class="dev-state" id="herdrState">Locked<small>password</small></span>
      <span class="toggle"></span>
    </button>
    <div class="gate-body" id="herdrBody">
      <p class="g-locked" id="herdrLocked" hidden>Open this from the panel.</p>
      <div class="g-out" id="herdrOut" hidden></div>
    </div>
  </section>

  <!-- herdr:begin (sealed by scripts/herdr-gate.mjs; edit the plaintext in secret/ instead) -->
  <script type="application/json" id="herdrCipher">{"v":1,"n":4,"iter":600000,"salt":"xFPciMd5HNLYlbX5LWgXgQ","iv":"LFDrxzDfO5Esd0kv","ct":"2keDmA37Tnq6w25I6_MTl15xd69wtz_8d976DtaSHjIw3TP4pGhN1d5jc7hmYLcd7Uan-_1AobjbqYu63_8ORKg166U9MS6bcKsyPPjInImPOVkOYGqUX4j_ca5Ai2FjU8cgmipyDIEE4tN1w9DFpzhUIQuGdQCCZesW7Itfz7j4N75_Y5AvjWWlfbwyTM86SVccVBNy5r6c86pPpequAt1YJyXNwPD_2fOMHJms5VGle7JhqHyBCCEzT191OzYfGUDMDiJ3RjxASu5imoERw2yS9mkTXnma70Yyo7Sfr8Etwn-pzGiIhA"}</script>
  <!-- herdr:end -->

  <div id="list" aria-live="polite"></div>
</main>

<script>
  // Data comes from the pi-status Worker, which each machine's agent reports
  // to every minute. The read key is only in the sealed secret panel, which
  // opens this page as devices/#k=KEY.
  const API = 'https://pi-status.pizza-calc-api.workers.dev';
  const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const ONLINE_SECONDS = 150;      // reports come every 60 s
  const $ = id => document.getElementById(id);
  const open = new Set();
  let data = null, fetchedAt = 0;

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  const ago = s => s < 60 ? `${Math.max(0, Math.round(s))}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  const dur = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
  const gb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';

  const STATUS = {
    running:   ['ok', 'Running'],
    starting:  ['warn', 'Starting'],
    done:      ['ok', 'Finished OK'],
    scheduled: ['ok', 'Scheduled'],
    trouble:   ['warn', 'Needs a look'],
    failed:    ['bad', 'Failed'],
    stopped:   ['off', 'Stopped'],
  };
  const ORDER = { failed:0, trouble:1, starting:2, running:3, scheduled:4, done:5, stopped:6 };
  const KIND = { service:'service', program:'program', cron:'scheduled job', container:'container' };

  function deviceRow(d, age){
    const r = d.report, dev = r.device || {};
    const online = age < ONLINE_SECONDS;
    const box = el('section', 'dev' + (open.has(d.id) ? ' open' : ''));
    const sum = el('button', 'dev-sum');
    sum.type = 'button';
    sum.setAttribute('aria-expanded', open.has(d.id));
    const things = r.things || [];
    const bad = things.filter(t => t.status === 'failed' || t.status === 'trouble').length;
    sum.append(el('span', 'dot ' + (!online ? '' : bad ? 'warn' : 'ok')));
    const who = el('span');
    who.append(el('div', 'dev-name', (dev.tailscale && dev.tailscale.name) || dev.hostname || d.id),
               el('div', 'dev-what', [dev.model, dev.os].filter(Boolean).join(' · ')));
    const state = el('span', 'dev-state', online ? 'Connected' : 'Offline');
    state.append(el('small', '', online ? `${things.filter(t => t.status === 'running').length} running` + (bad ? ` · ${bad} ${bad === 1 ? "needs" : "need"} a look` : '') : 'last seen ' + ago(age)));
    sum.append(who, state, el('span', 'toggle'));
    sum.addEventListener('click', () => { open.has(d.id) ? open.delete(d.id) : open.add(d.id); render(); });
    box.append(sum);

    const body = el('div', 'dev-body');
    const stats = el('div', 'stats');
    const stat = (label, value, frac) => {
      const s = el('div', 'stat');
      s.append(el('b', '', value), el('span', '', label));
      if(frac != null){ const b = el('div', 'bar'), i = el('i'); i.style.width = Math.min(100, Math.round(frac * 100)) + '%'; b.append(i); s.append(b); }
      stats.append(s);
    };
    if(dev.temp_c != null) stat('Temperature', dev.temp_c + ' °C', dev.temp_c / 85);
    if(dev.load) stat('CPU load', dev.load[0].toFixed(2), dev.cpus ? dev.load[0] / dev.cpus : null);
    if(dev.mem_total) stat('Memory', `${gb(dev.mem_used)} / ${gb(dev.mem_total)}`, dev.mem_used / dev.mem_total);
    if(dev.disk_total) stat('Disk', `${gb(dev.disk_used)} / ${gb(dev.disk_total)}`, dev.disk_used / dev.disk_total);
    if(dev.uptime) stat('Up for', dur(dev.uptime + (online ? age : 0)));
    stat('Last report', ago(age));
    body.append(stats);

    body.append(el('div', 'label', 'Running on it'));
    const list = el('div', 'things');
    const sorted = things.slice().sort((a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9) || a.name.localeCompare(b.name));
    if(!sorted.length) list.append(el('div', 'empty', 'Nothing of yours is running on it right now.'));
    const now = Date.now() / 1000;
    for(const t of sorted){
      const [cls, label] = STATUS[t.status] || ['off', t.status];
      const row = el('div', 'thing');
      const name = el('div', 't-name', t.name);
      name.append(el('span', 'kind', KIND[t.kind] || t.kind));
      row.append(el('span', 'dot ' + cls), name, el('span', 't-status ' + cls, label));
      if(t.check) row.append(el('div', 't-check' + (t.check.ok ? '' : ' bad'), t.check.label));
      const meta = [];
      if(t.since && t.status !== 'stopped') meta.push('since ' + ago(now - t.since).replace(' ago', '') + ' ago');
      if(t.last_seen) meta.push('last seen ' + ago(now - t.last_seen));
      if(t.cpu != null) meta.push(`CPU ${t.cpu}%`);
      if(t.mem) meta.push(gb(t.mem));
      if(t.procs > 1) meta.push(`${t.procs} processes`);
      if(meta.length) row.append(el('div', 't-meta', meta.join(' · ')));
      if(t.detail) row.append(el('div', 't-detail', t.detail));
      list.append(row);
    }
    body.append(list);
    const hint = el('p', 'hint');
    hint.append('New programs, services and cron jobs show up here on their own within a minute. Rename or hide one in ');
    hint.append(el('code', '', '~/pi-status/names.json'), ' on the device.');
    body.append(hint);
    box.append(body);
    return box;
  }

  function render(){
    const list = $('list');
    if(!data){ return; }
    const since = (Date.now() - fetchedAt) / 1000;
    const nodes = data.devices.map(d => deviceRow(d, d.age + since));
    if(!nodes.length){
      const e = el('div', 'empty', 'No devices have reported yet.');
      e.append(el('small', '', 'Install the agent on the Pi and it appears within a minute.'));
      nodes.push(e);
    }
    list.replaceChildren(...nodes);
    $('fresh').textContent = 'Updated ' + ago(since);
  }

  async function load(){
    if(!KEY){
      $('list').replaceChildren(el('div', 'empty', 'Open this from the secret panel.'));
      return;
    }
    try {
      const r = await fetch(API + '/devices', { headers:{ Authorization:'Bearer ' + KEY }, cache:'no-store' });
      if(r.status === 401) throw new Error('key');
      if(!r.ok) throw new Error(r.status);
      data = await r.json();
      fetchedAt = Date.now();
      render();
    } catch(e){
      if(!data) $('list').replaceChildren(el('div', 'empty', e.message === 'key' ? 'That key doesn’t work any more.' : 'Couldn’t reach the status server.'));
      $('fresh').textContent = 'Couldn’t refresh';
    }
  }

  // ---- the on/off switch ----
  // Writing needs the same key this page already has; the Pi reads the switch with its own token
  // and acts on it within a minute, so the label reports "asking the Pi" rather than pretending it
  // is instant.
  let switchOn = null, flipping = false;

  function paintSwitch(){
    if(switchOn === null) return;
    const t = $('swToggle');
    $('swCard').hidden = false;
    t.setAttribute('aria-checked', switchOn ? 'true' : 'false');
    t.disabled = flipping;
    $('swWhat').textContent = flipping
      ? (switchOn ? 'starting it up on the Pi…' : 'stopping it on the Pi…')
      : switchOn
        ? 'the news feed is running on the television'
        : 'off — the screen is blank and the Trends tab is hidden';
  }

  async function loadSwitch(){
    if(!KEY) return;
    try {
      const r = await fetch(API + '/switch', { headers:{ Authorization:'Bearer ' + KEY }, cache:'no-store' });
      if(!r.ok) return;
      switchOn = (await r.json()).on !== false;
      paintSwitch();
    } catch(e){ /* leave it as it was rather than flicker */ }
  }

  async function flipSwitch(){
    if(flipping || switchOn === null) return;
    const want = !switchOn;
    flipping = true; switchOn = want; paintSwitch();
    try {
      const r = await fetch(API + '/switch', {
        method:'POST',
        headers:{ Authorization:'Bearer ' + KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ on: want }),
      });
      if(!r.ok) throw new Error(r.status);
      switchOn = (await r.json()).on !== false;
      // give the Pi's timer a moment, then stop showing the in-between wording
      setTimeout(() => { flipping = false; paintSwitch(); load(); }, 65000);
    } catch(e){
      flipping = false;
      switchOn = !want;                       // it did not take; show what is really true
      paintSwitch();
      $('swWhat').textContent = 'couldn’t reach the switch — nothing changed';
    }
    paintSwitch();
  }

  $('swToggle').addEventListener('click', flipSwitch);
  $('refresh').addEventListener('click', () => { load(); loadSwitch(); });
  loadSwitch();
  setInterval(() => { if(!flipping) loadSwitch(); }, 20000);
  load();
  setInterval(load, 20000);
  setInterval(render, 5000);
</script>

<script>
// ---- the herdr card ----
// docs/devices/index.html is public: the tab is hidden, the file is not. So the tailnet
// URL is not written here -- #herdrCipher is AES-GCM.
//
// THE KEY IS THE PANEL'S (2026-10-04). This card used to carry its own password box and
// its own three traffic lights, so opening it meant logging in twice with two different
// credentials: the dots at the top of the panel, then three more buttons here. Both are
// gone. The card is sealed under the panel's word + dot order and asks the parent for it.
(function(){
  const cipherEl = document.getElementById('herdrCipher');
  if(!cipherEl) return;
  const box = JSON.parse(cipherEl.textContent);
  const card   = document.getElementById('herdrCard');
  const sum    = document.getElementById('herdrSum');
  const out    = document.getElementById('herdrOut');
  const locked = document.getElementById('herdrLocked');
  let unlocked = false;

  const unb64 = s => {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  };

  // The panel opened with a word and a dot order; this card is sealed under the same
  // secret, so it asks the parent for it rather than showing a second set of buttons.
  // Same-origin, so this is a plain function call. Opened on its own it stays shut --
  // deliberately, because a gate here would be the second login all over again.
  function panelSecret(){
    try {
      return (window.parent !== window && typeof window.parent.__panelSecret === 'function')
        ? (window.parent.__panelSecret() || '') : '';
    } catch(e){ return ''; }   // different origin: treat as no key
  }

  // Must match secretFor() in scripts/herdr-gate.mjs and the panel's tryUnlock().
  async function openBox(secret){
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', hash:'SHA-256', salt: unb64(box.salt), iterations: box.iter }, base, 256);
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const pt  = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function reveal(p){
    unlocked = true;
    out.hidden = false;
    locked.hidden = true;
    const what = document.createElement('p');
    what.textContent = p.what;
    const a = document.createElement('a');
    a.className = 'open'; a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Open ' + p.name;
    const note = document.createElement('p');
    note.className = 'g-url';
    note.textContent = p.note + ' \u2014 ' + p.url;
    out.replaceChildren(what, a, note);
    document.getElementById('herdrState').textContent = 'Unlocked';
  }

  (async () => {
    const secret = panelSecret();
    if(secret){
      try { reveal(await openBox(secret)); return; }
      catch(e){ /* the panel key did not fit: fall through */ }
    }
    locked.hidden = false;
    document.getElementById('herdrState').textContent = 'Locked';
  })();

  sum.addEventListener('click', () => {
    const nowOpen = !card.classList.contains('open');
    card.classList.toggle('open', nowOpen);
    sum.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
    if(nowOpen && !unlocked) input.focus();
  });
})();
</script>
</body>
</html>
