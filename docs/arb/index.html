  // is small and the point is that it is moving.
  function countdown(s) {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    return m ? m + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s";
  }

  function tickLive(node) {
    const close = Date.parse(node.dataset.close || "");
    const cost = money(parseFloat(node.dataset.cost || "0"));
    if (isNaN(close)) { node.textContent = "LIVE · " + cost + " at stake"; return; }
    const left = (close - Date.now()) / 1000;
    node.textContent = "LIVE · " + cost + " at stake · "
      + (left > 0 ? "settles in " + countdown(left)
                  : "window closed, waiting on both venues to resolve");
  }

  // One timer for every live row on the page. Cheap, and it keeps the
  // countdown honest between the 30-second feed refreshes.
  setInterval(() => {
    document.querySelectorAll(".live-line span[data-close]").forEach(tickLive);
  }, 1000);

  // The live positions, lifted out of the timeline and put at the top.
  // Buried among settled rows they were effectively invisible, which is
  // the opposite of what an open position needs to be.
  function renderLive(trades) {
    const open = (trades || []).filter(t => t.state !== "settled");
    const box = el("div", "livebox");
    const h = el("h3");
    if (open.length) h.appendChild(el("span", "dot"));
    h.appendChild(document.createTextNode(
      open.length ? "Live now · " + open.length
                    + (open.length === 1 ? " position" : " positions")
                  : "Live now"));
    box.appendChild(h);
    if (!open.length) {
      box.appendChild(el("div", "none",
        "Nothing open. Positions appear here the moment both legs fill, "
        + "and stay until the window settles."));
      return box;
    }
    let risk = 0;
    open.forEach(t => { risk += (t.cost || 0); box.appendChild(tradeRow(t)); });
    box.appendChild(el("div", "none", "Total at stake: " + money(risk)));
    return box;
  }

  function renderHistory() {
    const P = PAPER || {};
    const trades = P.trades || [], misses = P.misses || [];
    const body = $("#histbody"), lede = $("#histlede");
    const stats = $("#histstats"), tl = $("#histtl");
    body.textContent = ""; stats.textContent = ""; tl.textContent = "";

    // Live positions first, above the timeline. They are the only rows
    // where money is still moving, so they do not get buried in it.
    body.appendChild(renderLive(trades));

    // ---- bucket every event into its half hour
    const slots = new Map();
    const bucket = k => {
      if (!slots.has(k)) slots.set(k, { t: [], m: [] });
      return slots.get(k);
    };
    let oldest = null;
    const note = (iso, kind, o) => {
      const d = new Date(iso);
      if (isNaN(d)) return;           // rows written before misses carried a date
      o._d = d;
      bucket(slotKey(d))[kind].push(o);
      if (!oldest || d < oldest) oldest = d;
    };
    trades.forEach(t => note(t.opened, "t", t));
    misses.forEach(m => note(m.ts, "m", m));

    // ---- how far back this reaches
    const now = new Date();
    const sinceRaw = P.since ? new Date(P.since) : null;
    const since = sinceRaw && !isNaN(sinceRaw) ? sinceRaw : null;
    const floorBy = new Date(+now - MIN_SLOTS * SLOT_MIN * 60000);
    let from = since || oldest || floorBy;
    if (oldest && oldest < from) from = oldest;
    if (from > floorBy) from = floorBy;

    let keys = [];
    for (let k = +slotStart(from), last = +slotStart(now);
         k <= last; k += SLOT_MIN * 60000) keys.push(k);
    if (keys.length > MAX_LOG) keys = keys.slice(-MAX_LOG);

    // ---- the four figures
    const taken  = (P.settled || 0) + (P.open || 0);
    const naked  = (P.naked_settled || 0) + (P.naked_open || 0);
    const hedged = Math.max(0, taken - naked);
    const real   = P.realised || 0;
    const fig = (v, k, cls) => {
      const d = el("div");
      d.appendChild(el("span", "n" + (cls ? " " + cls : ""), v));
      d.appendChild(el("span", "k", k));
      stats.appendChild(d);
    };
    const passed = P.passed_total != null ? P.passed_total : misses.length;
    fig(String(taken),  "taken",    taken  ? "" : "z");
    fig(String(hedged), "hedged",   hedged ? "" : "z");
    fig(String(naked),  "naked",    naked  ? "down" : "z");
    fig(String(passed), "passed",   passed ? "near" : "z");
    fig(money(real),    "realised", real > 0 ? "up" : real < 0 ? "down" : "z");

    // ---- the grid
    const near = P.passed_total != null ? P.passed_total : misses.length;
    const head = el("div", "head");
    head.appendChild(el("span", "cap", "one cell per hour"
      + (near ? " · " + near + " came close" : "")));
    const modes = el("span", "modes");
    [["day", "Day"], ["week", "Week"]].forEach(([m, txt]) => {
      const b = el("button", null, txt);
      b.type = "button";
      b.setAttribute("aria-pressed", String(STRIP_MODE === m));
      b.addEventListener("click", () => { STRIP_MODE = m; renderHistory(); });
      modes.appendChild(b);
    });
    head.appendChild(modes);
    tl.appendChild(head);

    const days = STRIP_MODE === "week" ? 7 : 1;
    const midnight = new Date(now);
    midnight.setHours(0, 0, 0, 0);
    const sinceMs = since ? +since : null;

    const grid = el("div", "grid " + STRIP_MODE);
    grid.style.gridTemplateColumns = "57px repeat(24,1fr)";

    // hour ruler, labelled every three hours so it stays legible narrow
    grid.appendChild(el("span"));
    for (let h = 0; h < 24; h++) {
      grid.appendChild(el("span", "tick", h % 3 === 0
        ? (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? "a" : "p") : ""));
    }

    for (let d = days - 1; d >= 0; d--) {
      const day0 = new Date(midnight);
      day0.setDate(day0.getDate() - d);
      const isToday = d === 0;
      grid.appendChild(el("span", "lab" + (isToday ? " today" : ""),
        isToday ? "Today"
          : day0.toLocaleDateString(undefined, { weekday: "short" })
            + " " + (day0.getMonth() + 1) + "/" + day0.getDate()));
      for (let h = 0; h < 24; h++) {
        const cellAt = new Date(day0);
        cellAt.setHours(h, 0, 0, 0);
        const k = +cellAt;
        const sl = slots.get(k);
        const c = el("div", "cell");
        let what = "watched, nothing";
        if (sl && sl.t.length) {
          const pl = sl.t.reduce((a, x) => a + (x.pnl || 0), 0);
          c.className = "cell " + (pl < 0 ? "loss" : "trade");
          what = sl.t.length + " taken";
        } else if (sl && sl.m.length) {
          c.className = "cell near";
          what = sl.m.length + " came close";
        } else if (k > +now) {
          c.className = "cell future";
          what = "not yet";
        } else if (sinceMs && k + HOUR <= sinceMs) {
          c.className = "cell before";
          what = "before this account started";
        }
        c.title = slotLabel(k) + " — " + what;
        grid.appendChild(c);
      }
    }
    tl.appendChild(grid);

    const key = el("div", "key");
    [["none", "not watched"], ["", "watched, nothing"],
     ["near", "came close, passed"], ["trade", "position taken"]]
      .forEach(([cls, txt]) => {
        const sp = el("span", cls || null);
        sp.appendChild(el("i"));
        sp.appendChild(document.createTextNode(txt));
        key.appendChild(sp);
      });
    tl.appendChild(key);

    const bestBox = $("#histbest");
    bestBox.textContent = "";
    if (P.best_pass && P.best_pass.net != null) {
      const b = Object.assign({}, P.best_pass);
      b._d = new Date(b.ts);
      if (!isNaN(b._d)) bestBox.appendChild(bestCard(b));
    }

    // ---- the line that says what all of that means
    const watchedMin = Math.max(0, (now - (since || oldest || new Date(keys[0]))) / 60000);
    lede.textContent = taken
      ? taken + " position" + (taken === 1 ? "" : "s") + " in "
        + spanWords(watchedMin) + " of watching, newest first."
      : near
        ? "Nothing taken in " + spanWords(watchedMin) + ". " + near
          + " full trade" + (near === 1 ? "" : "s") + " cleared the floor and "
          + (near === 1 ? "was" : "were") + " still passed — each one is "
          + "below with both sides’ odds and why it was turned down."
        : "Nothing taken in " + spanWords(watchedMin) + ", and nothing has even "
          + "cleared the floor to be considered.";

    // ---- the log, newest first, quiet runs collapsed to one line
    let run = [];
    const flushRun = () => {
      if (!run.length) return;
      const oldK = run[run.length - 1], newK = run[0];
      const g = el("div", "gap");
      g.appendChild(el("span", "gt", run.length === 1 ? slotLabel(oldK)
        : edgeLabel(oldK) + "–" + edgeLabel(newK + SLOT_MIN * 60000)));
      g.appendChild(el("span", null, run.length + " hour"
        + (run.length === 1 ? "" : "s") + " · nothing cleared the floor"));
      body.appendChild(g);
      run = [];
    };

    keys.slice().reverse().forEach(k => {
      const s = slots.get(k);
      if (!s || (!s.t.length && !s.m.length)) { run.push(k); return; }
      flushRun();
      const sl = el("div", "slot");
      const sh = el("div", "sh");
      const lab = el("span");
      lab.appendChild(el("b", null, slotLabel(k)));
      sh.appendChild(lab);
      sh.appendChild(el("span", null,
        (s.t.length ? s.t.length + " taken" : "")
        + (s.t.length && s.m.length ? " · " : "")
        + (s.m.length ? s.m.length + " passed" : "")));
      sl.appendChild(sh);
      s.t.sort((a, b) => b._d - a._d).forEach(t => sl.appendChild(tradeRow(t)));
      const ms = s.m.sort((a, b) => b._d - a._d);
      ms.slice(0, MAX_EV).forEach(m => sl.appendChild(missRow(m)));
      if (ms.length > MAX_EV) {
        sl.appendChild(el("div", "more",
          "+ " + (ms.length - MAX_EV) + " more passed in this hour"));
      }
      body.appendChild(sl);
    });
    flushRun();
  }

  function openHistory() { $("#hist").hidden = false; renderHistory(); }
  function closeHistory() { $("#hist").hidden = true; }
  $("#histclose").addEventListener("click", closeHistory);
  $("#hist").addEventListener("click", e => {
    if (e.target === $("#hist")) closeHistory();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeHistory();
  });

  // The bar tucks away on scroll down and comes back on scroll up.
  (() => {
    let lastY = 0;
    window.addEventListener("scroll", () => {
      const bar = $("#paper");
      if (!bar || bar.hidden) return;
      const y = window.scrollY;
      bar.classList.toggle("tucked", y > 90 && y > lastY);
      lastY = y;
    }, { passive: true });
  })();

  function refreshPaper() {
    fetch(LIVE + "/paper.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(p => {
        if (!p) return;
        PAPER = p;
        paperCard({ paper: p });
        if (!$("#hist").hidden) renderHistory();
      })
      .catch(() => {});
  }

  function sysCard(d) {
    const box = $("#sys");
    if (!d || !box) return;
    box.hidden = false;
    const esc = t => String(t).replace(/[<>&]/g, c =>
      ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
    const alive = d.alive || {};
    const names = Object.keys(alive);
    const up = names.filter(n => alive[n]).length;
    const sm = d.sampler || {};
    const st = d.settlement || {};
    const pa = d.paper || {};
    const c20 = ((sm.curves || {}).qty20 || {}).curve || [];

    const sec = t => "<h3 style=\"margin-top:22px;font-size:12px;"
      + "letter-spacing:.08em;text-transform:uppercase;color:var(--muted)\">"
      + t + "</h3>";

    let h = "<h2>System</h2><p class=\"lede\">What is running, how much has "
          + "been measured, and what it says so far.</p><div class=\"grid\">";

    h += "<div class=\"box\"><h3>Collectors</h3><div class=\"big\">"
       + up + " / " + names.length + "</div><div class=\"sub\">";
    h += names.map(n => '<span class="dot" style="background:'
       + (alive[n] ? "var(--good)" : "var(--bad)") + '"></span>'
       + esc(n.replace(".py", ""))).join("<br>");
    h += "</div></div>";

    h += "<div class=\"box\"><h3>Second-by-second sample</h3><div class=\"big\">"
       + (sm.rows ? sm.rows.toLocaleString() : "0") + "</div>"
       + "<div class=\"sub\">quotes over " + (sm.hours || 0) + " h"
       + (sm.newest_age_s != null
          ? " &middot; newest " + Math.round(sm.newest_age_s) + "s ago" : "")
       + "</div></div>";

    h += "<div class=\"box\"><h3>Settlement agreement</h3><div class=\"big\">"
       + (st.agreement_pct != null ? st.agreement_pct + "%" : "--") + "</div>"
       + "<div class=\"sub\">" + (st.agreed || 0) + " / " + (st.windows || 0)
       + " windows &middot; " + (st.disagreed || 0) + " disagreed<br>"
       + "95% lower bound " + (st.wilson_lower_pct != null
            ? st.wilson_lower_pct + "%" : "--") + "</div></div>";

    const eq = pa.equity, start = 209.0088;
    const dpnl = eq != null ? eq - start : null;
    h += "<div class=\"box\"><h3>Paper account (real books)</h3>"
       + "<div class=\"big " + (dpnl >= 0 ? "ok" : "bad") + "\">"
       + (eq != null ? "$" + eq.toFixed(2) : "--") + "</div>"
       + "<div class=\"sub\">from $209.01 &middot; "
       + (dpnl != null ? (dpnl >= 0 ? "+" : "") + "$" + dpnl.toFixed(2) : "--")
       + "<br>" + (pa.settled || 0) + " settled, " + (pa.open || 0) + " open"
       + " &middot; " + (pa.divergences || 0) + " divergences"
       + "<br><span class=\"" + ((pa.naked_settled || pa.naked_open)
            ? "bad" : "") + "\">naked (one leg only): "
       + (pa.naked_settled || 0) + " settled"
       + (pa.naked_pnl ? " " + (pa.naked_pnl >= 0 ? "+" : "")
            + "$" + pa.naked_pnl.toFixed(2) : "")
       + ", " + (pa.naked_open || 0) + " open</span></div></div>";

    // Split the P&L. A naked leg is an unhedged coin flip that happened
    // because one order filled and the other did not -- it is not the
    // strategy working, and a headline number that mixes the two reads
    // as if it were. This is the exact thing the old harness hid by
    // recording one-legged fills as "no trade".
    const hedgedPnl = (pa.realised || 0) - (pa.naked_pnl || 0);
    const hedgedN = (pa.settled || 0) - (pa.naked_settled || 0);
    h += "</div>";

    if (c20.length) {
      h += "<h3 style=\"margin-top:22px;font-size:12px;letter-spacing:.08em;"
         + "text-transform:uppercase;color:var(--muted)\">"
         + "How much survives a safety margin (20+ contracts both sides)</h3>";
      h += "<div class=\"scroll\"><table><tr><th>margin / leg</th><th>samples</th><th>tradeable</th>"
         + "<th>rate</th><th>median</th><th>best</th></tr>";
      c20.forEach(r => {
        h += "<tr><td>" + r.safety_c.toFixed(2) + "c</td><td>"
           + r.n.toLocaleString() + "</td><td>" + r.tradeable + "</td><td>"
           + r.rate_pct.toFixed(3) + "%</td><td>" + r.median_c.toFixed(2)
           + "c</td><td class=\"" + (r.best_c > 0 ? "ok" : "bad") + "\">"
           + r.best_c.toFixed(2) + "c</td></tr>";
      });
      h += "</table></div>";
    }

    if (pa.settled != null) {
      h += "<p class=\"note\" style=\"margin-top:14px\"><b>Where that "
         + "money came from.</b> " + hedgedN + " hedged pair"
         + (hedgedN === 1 ? "" : "s") + " settled for "
         + (hedgedPnl >= 0 ? "+" : "") + "$" + hedgedPnl.toFixed(2) + ", and "
         + (pa.naked_settled || 0) + " <i>naked</i> leg"
         + ((pa.naked_settled || 0) === 1 ? "" : "s")
         + " &mdash; one order filled, the other missed &mdash; settled for "
         + ((pa.naked_pnl || 0) >= 0 ? "+" : "") + "$"
         + (pa.naked_pnl || 0).toFixed(2) + ". "
         + (Math.abs(pa.naked_pnl || 0) > Math.abs(hedgedPnl)
            ? "<b class=\"bad\">The naked legs dominate this number, so it "
              + "is not a result &mdash; it is unhedged coin flips that "
              + "happened to land this way.</b> "
            : "")
         + "An earlier version of this account recorded one-legged fills as "
         + "\u201cno trade\u201d and deleted them, which is why it once "
         + "reported itself perfectly hedged. A sent order cannot be "
         + "un-sent.</p>";
    }

    const bd = d.bands || [];
    if (bd.length) {
      h += sec("The gap by price band &mdash; the fee is quadratic, so a "
             + "pooled median hides the corners");
      h += "<div class=\"scroll\"><table><tr><th>min(p, 1&minus;p)</th><th>samples</th>"
         + "<th>fee / contract</th><th>median net</th>"
         + "<th>20+ both sides</th><th>venues disagree</th></tr>";
      bd.forEach(r => {
        h += "<tr><td>" + esc(r.band) + "</td><td>" + r.n.toLocaleString()
           + "</td><td>" + r.fee_c.toFixed(2) + "c</td><td class=\"bad\">"
           + r.net_c.toFixed(2) + "c</td><td>" + r.deep_pct.toFixed(0)
           + "%</td><td><b>" + r.disagree_c.toFixed(2) + "c</b></td></tr>";
      });
      h += "</table></div><p class=\"note\">The last column is the mid-to-mid "
         + "difference with no fee charged at all &mdash; what the two "
         + "venues actually disagree about. It is 0.00c in every band, so "
         + "the median net <i>is</i> the fee and nothing else. The cheap "
         + "corner is real (the round trip falls about ten-fold) and it is "
         + "not a liquidity mirage (two thirds still show 20+ contracts a "
         + "side) &mdash; the venues simply agree there too.</p>";
    }

    const mk = d.maker || [];
    if (mk.length) {
      h += sec("Resting the Polymarket leg instead of taking it");
      h += "<div class=\"scroll\"><table><tr><th>min(p, 1&minus;p)</th><th>fills</th>"
         + "<th>hedge slip</th><th>net if instant</th><th>net as rested</th>"
         + "<th>rebate t1 / t4</th></tr>";
      mk.forEach(r => {
        h += "<tr><td>" + esc(r.band) + "</td><td>" + r.fills.toLocaleString()
           + "</td><td class=\"bad\">+" + r.slip_c.toFixed(2) + "c</td><td>"
           + r.instant_c.toFixed(2) + "c</td><td class=\"bad\">"
           + r.rested_c.toFixed(2) + "c</td><td>"
           + r.rebate_t1_c.toFixed(3) + "c / " + r.rebate_t4_c.toFixed(3)
           + "c</td></tr>";
      });
      h += "</table></div><p class=\"note\">The rebate is real and large: it "
         + "turns the deep band from &minus;4.94c taker-to-taker into "
         + "&minus;1.66c. Then the Kalshi hedge slips a full tick while the "
         + "resting order waits to be chosen, and it ends at &minus;2.66c. "
         + "The rebate is &theta;&middot;p&middot;(1&minus;p) &mdash; the "
         + "same quadratic as the fee &mdash; so at the extremes the best "
         + "tier pays 0.03c against 0.25c of adverse selection. It is worth "
         + "least exactly where it would have mattered. Measured at a 1s "
         + "cadence against a ~125ms real hedge, so this is the pessimistic "
         + "bound.</p>";
    }

    const sg = d.strikegap || null;
    if (sg && (sg.coins || []).length) {
      h += sec("Do the two venues even use the same strike?");
      h += "<div class=\"scroll\"><table><tr><th>coin</th><th>windows</th><th>strike gap</th>"
         + "<th>median margin</th><th>closest</th>"
         + "<th>landed between</th><th>implied split rate</th></tr>";
      sg.coins.forEach(r => {
        const live = r.gap_pct > 0;
        h += "<tr><td>" + esc(r.coin) + "</td><td>" + r.n + "</td><td class=\""
           + (live ? "bad" : "ok") + "\">" + r.gap_pct.toFixed(5)
           + "%</td><td>" + r.median_margin_pct.toFixed(4) + "%</td><td>"
           + r.closest_pct.toFixed(4) + "%</td><td>" + r.between
           + "</td><td class=\"" + (live ? "bad" : "ok") + "\">"
           + (live ? r.split_rate_pct.toFixed(2) + "%"
                   : "0 \u2014 identical") + "</td></tr>";
      });
      h += "</table></div><p class=\"note\">Settlement agreeing " + sg.windows
         + "/" + sg.windows + " times only means something if some window "
         + "came close. These are the margins. <b>And one real divergence "
         + "channel turned up here:</b> Kalshi and Polymarket US publish the "
         + "same strike to the last digit on btc, eth and sol \u2014 but not "
         + "on xrp, where Kalshi rounds the reference to 4 decimals and "
         + "Polymarket US carries 5. A settlement landing strictly between "
         + "the two resolves <i>opposite ways</i>, and a hedge then loses "
         + "the <b>whole stake</b>, not a few cents of fee. "
         + sg.between + " of " + sg.windows + " windows landed there; the "
         + "density of near misses puts it near 1.2% on xrp and exactly zero "
         + "on the other three. Break-even on a 3c edge needs it under ~3%."
         + "</p>";
    }

    const tx = d.taxes || null;
    if (tx && (tx.rows || []).length) {
      h += sec("What the tax characterization does to a hedged pair");
      h += "<div class=\"scroll\"><table><tr><th>unit cost</th><th>gross edge</th>"
         + "<th>gross winnings</th><th>capital / 1256</th>"
         + "<th>federal wagering</th><th>+ Massachusetts</th></tr>";
      tx.rows.forEach(r => {
        h += "<tr><td>" + r.unit.toFixed(4) + "</td><td>"
           + r.edge_c.toFixed(2) + "c</td><td>" + r.gross_win_c.toFixed(2)
           + "c</td><td class=\"ok\">+" + r.capital_c.toFixed(2)
           + "c</td><td class=\"" + (r.fed_wager_c >= 0 ? "ok" : "bad")
           + "\">" + (r.fed_wager_c >= 0 ? "+" : "") + r.fed_wager_c.toFixed(2)
           + "c</td><td class=\"" + (r.fed_ma_c >= 0 ? "ok" : "bad") + "\">"
           + (r.fed_ma_c >= 0 ? "+" : "") + r.fed_ma_c.toFixed(2)
           + "c</td></tr>";
      });
      h += "</table></div><p class=\"note\">A hedged pair books one winner and "
         + "one loser. Net gain 3c; gross winnings on the winning ticket "
         + "~51c. Massachusetts does not adopt IRC 165(d) &mdash; losses are "
         + "deductible only against a Massachusetts-licensed gaming "
         + "establishment, which neither venue is &mdash; so it taxes the "
         + "gross at 5%: 2.5c against a 3c edge, about 86% before the IRS is "
         + "involved. And it does not shrink in the cheap corner, where the "
         + "fee is 0.39c. Federal assumes " + tx.fed_pct + "% marginal with "
         + "the 2026 OBBBA 90% loss haircut. <b>Unsettled:</b> if capital or "
         + "1256 treatment holds, only the first column applies. There is no "
         + "IRS guidance on event contracts and the published guides "
         + "contradict each other. Not tax advice &mdash; a question for a "
         + "CPA, and worth asking before any money moves.</p>";
    }

    const wy = pa.why_no_trade || [];
    if (wy.length) {
      h += "<h3 style=\"margin-top:22px;font-size:12px;letter-spacing:.08em;"
         + "text-transform:uppercase;color:var(--muted)\">"
         + "Why the paper account did not trade</h3>"
         + "<div class=\"scroll\"><table>";
      wy.forEach(r => {
        h += "<tr><td>" + esc(r.reason) + "</td><td>" + r.n + "</td></tr>";
      });
      h += "</table></div>";
    }

    const v = d.verdict || {};
    if (v.headline) {
      h += "<div class=\"verdict\"><b>" + esc(v.headline) + "</b><ul>";
      (v.points || []).forEach(p => { h += "<li>" + esc(p) + "</li>"; });
      h += "</ul></div>";
    }
    if (d.as_of) {
      const age = Math.max(0, Math.round((Date.now() - new Date(d.as_of)) / 1000));
      h += "<div class=\"age\">system panel " + age + "s old</div>";
    }
    box.innerHTML = h;
  }

  // THE REAL-MONEY BAR.
  //
  // trades.json counts TRADES (money moved), not attempts. An order that
  // was sent and filled nothing is in the record and is not a trade, and
  // a bar that counted it as one would be announcing activity that never
  // happened -- on the one line of this page about real money.
  function refreshReal() {
    fetch(LIVE + "/trades.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        const el = document.getElementById("realbar");
        if (!el || !d) { if (el) el.hidden = true; return; }
        const state = d.needs_attention ? "attention"
                    : d.trades_done ? "done" : "idle";
        el.dataset.state = state;
        const sub = d.trades_done
          ? `${d.attempts} order${d.attempts === 1 ? "" : "s"} sent`
          : "real money armed, nothing filled yet";
        el.innerHTML = '<span class="dot"></span><span></span>'
                     + '<span class="sub"></span>';
        // textContent, not innerHTML: the headline is built from a file
        // on the Pi and there is no reason for this page to interpret it
        // as markup.
        el.children[1].textContent = d.headline || "";
        el.children[2].textContent = sub;
        el.hidden = false;
      })
      .catch(() => {});
  }

  // THE LIVE RUN.
  //
  // Everything from the feed goes in with textContent, never innerHTML:
  // the strings are built on the Pi and there is no reason for this page
  // to interpret any of them as markup.
  function refreshRun() {
    fetch(LIVE + "/run.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        const box = document.getElementById("runp");
        if (!box || !d) { if (box) box.hidden = true; return; }
        const attention = d.trades && d.trades.needs_attention;
        box.dataset.state = attention ? "attention" : (d.state || "idle");

        const cell = (k, v, sub) => {
          const c = document.createElement("div");
          const kk = document.createElement("div");
          kk.className = "k"; kk.textContent = k;
          const vv = document.createElement("div");
          vv.className = "v"; vv.textContent = v;
          if (sub) { const sm = document.createElement("small");
                     sm.textContent = " " + sub; vv.appendChild(sm); }
          c.appendChild(kk); c.appendChild(vv);
          return c;
        };
        const money = n => (n === null || n === undefined || isNaN(n))
          ? "--" : "$" + Number(n).toFixed(2);

        box.textContent = "";
        const top = document.createElement("div");
        top.className = "top";
        const dot = document.createElement("span"); dot.className = "dot";
        const st = document.createElement("span"); st.className = "st";
        st.textContent = d.headline || d.state || "";
        const when = document.createElement("span"); when.className = "when";
        const age = d.generated
          ? Math.max(0, Math.round((Date.now() - new Date(d.generated)) / 1000))
          : null;
        when.textContent = age === null ? "" : age + "s ago";
        top.appendChild(dot); top.appendChild(st); top.appendChild(when);
        box.appendChild(top);

        const g = document.createElement("div"); g.className = "grid";
        g.appendChild(cell("orders",
          (d.orders_used === null || d.orders_used === undefined ? "--" : d.orders_used)
          + " / " + (d.orders_cap || "--"), "sent today"));
        g.appendChild(cell("time left",
          d.minutes_left === null || d.minutes_left === undefined
            ? "--" : Math.max(0, Math.round(d.minutes_left)) + "m",
          d.expires ? "ends " + d.expires : ""));
        const b = d.last_beat || {};
        g.appendChild(cell("best now",
          b.raw_c === undefined || b.raw_c === null
            ? "--" : b.raw_c.toFixed(2) + "c",
          "floor " + (d.floor_c === null || d.floor_c === undefined
            ? "--" : "+" + d.floor_c.toFixed(2) + "c")));
        const tr = d.trades || {};
        g.appendChild(cell("realised",
          tr.realised === null || tr.realised === undefined
            ? "--" : (tr.realised >= 0 ? "+" : "") + "$" + Math.abs(tr.realised).toFixed(4),
          "all time"));
        const sp = d.spendable || {};
        g.appendChild(cell("kalshi", money(sp.kalshi), "crypto shard"));
        g.appendChild(cell("polymarket", money(sp.polymarket_us), ""));
        g.appendChild(cell("gemini", money(sp.gemini), ""));
        box.appendChild(g);

        // Recent attempts. An order that filled nothing is still worth
        // showing: it is the difference between "watching" and "trying
        // and missing", and those two look the same in the trade record.
        const att = (d.attempts || []).slice(-4).reverse();
        if (att.length) {
          const a = document.createElement("div"); a.className = "att";
          att.forEach(x => {
            const row = document.createElement("div");
            const legs = (x.legs || []).map(l =>
              l.venue + " " + l.http + (l.filled ? " filled " + l.filled : " filled 0")
            ).join("  |  ");
            row.textContent = "attempt " + x.n + " -- "
              + (x.outcome || "in flight") + (legs ? "  (" + legs + ")" : "");
            a.appendChild(row);
          });
          box.appendChild(a);
        }

        const note = document.createElement("div"); note.className = "note";
        if (attention) {
          note.textContent = "A position needs looking at. Check the "
            + "venue accounts before starting anything else.";
        } else if (d.state === "stalled") {
          note.textContent = "The process is up but has not printed for a "
            + "while. That is not the same as watching -- check the log.";
        } else if (d.state === "stopped") {
          note.textContent = "The kill switch is set. Remove it before the "
            + "next run: rm ~/sportsarb/STOP";
        } else if (d.state === "idle") {
          note.textContent = "Nothing is running. Nothing can be sent.";
        } else if (d.state === "finished") {
          note.textContent = "The run ended: " + (d.ended || "");
        } else {
          note.textContent = "Watching both books. It only sends when a "
            + "pair clears the floor, so sending nothing is the normal "
            + "state. Stop it with: touch ~/sportsarb/STOP";
        }
        box.appendChild(note);
        box.hidden = false;
      })
      .catch(() => {});
  }

  function refreshSys() {
    fetch(LIVE + "/status.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) sysCard(d); })
      .catch(() => {});
  }

  // The charts are drawn at the pixel width they will occupy, so a resize
  // (or a rotate, or the grid collapsing to one column) has to redraw them
  // rather than stretch what is there. Keep the last payload for that.
  let LAST_MONEY = null;
  function refreshMoney() {
    fetch(LIVE + "/balances.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(b => { LAST_MONEY = b; renderMoney(b); })
      .catch(() => renderMoney(null));
  }
  let moneyResizeT = null;
  window.addEventListener("resize", () => {
    clearTimeout(moneyResizeT);
    moneyResizeT = setTimeout(() => {
      if (LAST_MONEY) renderMoney(LAST_MONEY);
    }, 140);
  });

  const LIVE = "https://arb.aedinlai.com";

  // The Pi serves the feed directly, which is minutes fresher than waiting
  // for a commit to rebuild on Pages. The committed snapshot stays as the
  // fallback for when the Pi is unreachable.
  // The venue board. Written by the scanner that already holds both
  // streams, so it is the same data the trader acted on, not a re-poll.
  function refreshBoard(first) {
    return fetch(LIVE + "/live.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(d => { render(d); foot(d); })
      .catch(e => {
        if (!first) return;
        $("#summary").appendChild(el("div", "headline",
          "Could not load the venue board."));
        $("#summary").appendChild(el("p", null, e.message));
      });
  }

  refreshBoard(true).then(() => {
    refreshPaper(); refreshMoney(); refreshSys(); refreshReal(); refreshRun();
    setInterval(refreshBoard, 5000);
    setInterval(refreshPaper, 20000);
    setInterval(refreshMoney, 60000);
    setInterval(refreshSys, 30000);
    // 15s: this is the line someone checks from a phone to find out
    // whether a trade landed, so it should not be the stalest thing on
    // the page. tradefeed.py rewrites the file every 20s.
    setInterval(refreshReal, 15000);
    // 10s: this is the line that says whether anything is running at
    // all, and runfeed.py rewrites the file every 15s.
    setInterval(refreshRun, 10000);
  });
})();
</script>
</body>
</html>
