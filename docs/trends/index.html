<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trends</title>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('../fonts/Inter-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');}
  :root{
    --paper:#ffffff; --ink:#101114; --muted:#6b7280; --faint:#6f747c;
    --line:#e6e7eb; --line-strong:#16171b; --wash:#f6f6f7;
    --ok:#1f9d55; --warn:#c98a06; --bad:#c92a2a; --off:#b8bcc4;
    --ai:#4f6bd8; --tech:#1f9d55; --finance:#b8860b; --like:#c92a2a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper); line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px;}

  main{max-width:980px; margin:0 auto; padding:32px clamp(16px,4vw,48px) 64px;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin:0 0 24px;}
  .head h1{font-size:22px;}
  .head p{color:var(--muted); font-size:14px; margin-top:4px;}
  .fresh{font-size:12.5px; color:var(--faint); display:flex; align-items:center; gap:10px;}
  .fresh button{font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--faint);}

  .dot{width:9px; height:9px; border-radius:50%; background:var(--off); flex-shrink:0; display:inline-block;}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(31,157,85,.14);}
  .dot.warn{background:var(--warn);}

  .now{border:1px solid var(--line-strong); border-radius:12px; padding:18px 20px; margin-bottom:12px;}
  .now-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .now-state{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600;}
  .now-when{margin-left:auto; font-size:12.5px; color:var(--faint);}
  .now-what{font-size:14px; color:var(--muted); margin-top:7px; overflow-wrap:anywhere;}

  .stats{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,112px),1fr)); gap:9px; margin-top:14px;}
  .stat{background:var(--wash); border-radius:9px; padding:9px 11px;}
  .stat b{display:block; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint);}

  .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:26px 0 8px;}

  .srcs{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,210px),1fr)); gap:9px;}
  .src{border:1px solid var(--line); border-radius:10px; padding:11px 13px; display:flex; gap:10px; align-items:center;}
  .src div{min-width:0;}
  .src b{font-size:14px; font-weight:600; display:block;}
  .src small{font-size:12px; color:var(--faint);}

  /* looking things up again */
  .find{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:6px;}
  .find input{flex:1 1 260px; font:inherit; font-size:15px; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; color:var(--ink); background:var(--paper);}
  .find input:focus{outline:none; border-color:var(--line-strong);}
  .chip{font-size:13px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; white-space:nowrap;}
  .chip.on{border-color:var(--line-strong); background:var(--ink); color:#fff;}
  .found{font-size:12.5px; color:var(--faint); margin:0 0 4px;}

  .day{margin-top:22px;}
  .day-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:7px; border-bottom:1px solid var(--line-strong);}
  .day-head h2{font-size:16px;}
  .day-head small{font-size:12.5px; color:var(--faint);}

  .item{display:grid; grid-template-columns:auto 1fr auto; gap:3px 12px; align-items:baseline; padding:13px 0; border-bottom:1px solid var(--line);}
  .pill{font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; padding:2px 7px; border-radius:999px; color:#fff; align-self:center;}
  .pill.ai{background:var(--ai);} .pill.tech{background:var(--tech);} .pill.finance{background:var(--finance);}
  .it-cap{font-size:15px; font-weight:500; overflow-wrap:anywhere;}
  .it-cap a{text-decoration:none; border-bottom:1px solid var(--line);}
  .it-cap a:hover{border-color:var(--ink);}
  .heart{color:var(--like); margin-left:6px;}
  .it-who{grid-column:2; font-size:12.5px; color:var(--faint);}
  .it-num{font-size:12.5px; color:var(--faint); white-space:nowrap; text-align:right;}
  mark{background:#fff2a8; color:inherit; border-radius:2px;}

  .more{margin-top:14px; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--faint);}
  .empty{color:var(--faint); font-size:13.5px; padding:16px 0;}
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Trends</h1>
      <p>The feed running on the Pi, and everything it has shown.</p>
    </div>
    <div class="fresh"><span id="fresh"></span><button type="button" id="refresh">Refresh</button></div>
  </div>
  <div id="body" aria-live="polite"><p class="empty">Loading…</p></div>
</main>

<script>
  // Same Worker as the Devices view. The Pi posts its live state every minute and the day's
  // history every few minutes. The read key only exists inside the sealed secret panel, which
  // opens this page as trends/#k=KEY.
  const API = 'https://pi-status.pizza-calc-api.workers.dev';
  const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const LIVE_SECONDS = 180;
  const TOPICS = ['ai', 'tech', 'finance'];
  const PAGE = 60;                 // rows shown per day before "show more"
  const $ = id => document.getElementById(id);

  let data = null, query = '', likedOnly = false, topic = '', shown = {};

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  const ago = s => s < 60 ? `${Math.max(0, Math.round(s))}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  const num = n => n == null ? '' : n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0','') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
  const clock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  // "Today", "Yesterday", then the weekday and date — easier to think back through than 2026-09-30
  function dayName(iso){
    const d = new Date(iso + 'T12:00:00');
    const today = new Date(); today.setHours(12,0,0,0);
    const diff = Math.round((today - d) / 86400000);
    if(diff === 0) return 'Today';
    if(diff === 1) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  }

  const STATE = {
    playing:  ['ok',   'Playing'],
    starting: ['warn', 'Starting up'],
    digesting:['ok',   'Writing the digest'],
    resting:  ['off',  'Resting'],
    stopped:  ['off',  'Stopped'],
    setup:    ['warn', 'Being set up'],
  };
  const SOURCE_NAME = { youtube: 'YouTube', reddit: 'Reddit', hackernews: 'Hacker News' };

  // highlight what was searched for, so the row she wants is obvious
  function caption(text, q){
    const box = el('span');
    if(!q){ box.append(document.createTextNode(text)); return box; }
    const i = text.toLowerCase().indexOf(q);
    if(i < 0){ box.append(document.createTextNode(text)); return box; }
    box.append(document.createTextNode(text.slice(0, i)), el('mark', '', text.slice(i, i + q.length)), document.createTextNode(text.slice(i + q.length)));
    return box;
  }

  function matches(it){
    if(likedOnly && !it.liked) return false;
    if(topic && it.topic !== topic) return false;
    if(!query) return true;
    return ((it.caption || '') + ' ' + (it.author || '')).toLowerCase().includes(query);
  }

  function itemRow(it){
    const row = el('div','item');
    row.append(el('span','pill ' + (it.topic||''), it.topic || '—'));
    const cap = el('div','it-cap');
    const text = it.caption || '(no title)';
    if(it.url){
      const a = el('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      a.append(caption(text, query)); cap.append(a);
    } else cap.append(caption(text, query));
    if(it.liked){ const h = el('span','heart','♥'); h.title = 'she liked this'; cap.append(h); }
    row.append(cap);
    const bits = [it.at ? clock(it.at) : '', num(it.views) ? num(it.views) + ' views' : ''].filter(Boolean);
    row.append(el('span','it-num', bits.join(' · ')));
    row.append(el('div','it-who', it.author || ''));
    return row;
  }

  function render(){
    const b = $('body');
    b.replaceChildren();
    if(!data){ b.append(el('p','empty','Could not reach the Pi status service.')); return; }
    const s = data.status;

    // what it is doing right now
    if(s){
      const live = s.age < LIVE_SECONDS;
      const [tone, word] = STATE[s.state] || ['warn', s.state || 'Unknown'];
      const now = el('section','now');
      const top = el('div','now-top');
      top.append(el('span','dot ' + (live ? tone : '')), el('span','now-state', live ? word : 'Not reporting'));
      top.append(el('span','now-when','updated ' + ago(s.age)));
      now.append(top);
      if(live && s.note) now.append(el('div','now-what', 'On screen now: ' + s.note));
      if(!live) now.append(el('div','now-what','Nothing has arrived for ' + ago(s.age) + '. The Pi may be off or offline.'));

      const t = s.today || {}, pi = s.pi || {};
      const stats = el('div','stats');
      const stat = (label, value) => { const n = el('div','stat'); n.append(el('b','',value), el('span','',label)); stats.append(n); };
      stat('shown today', String(t.seen || 0));
      stat('queued up', String(s.queue || 0));
      if(pi.freeMB != null) stat('pi memory free', (pi.freeMB/1024).toFixed(1) + ' GB');
      if(pi.tempC != null) stat('pi temperature', pi.tempC + ' °C');
      now.append(stats);
      b.append(now);

      b.append(el('div','label','Where it gets the feed'));
      const srcs = el('div','srcs');
      for(const [name, v] of Object.entries(s.sources || {})){
        const ok = v.health === 'ok';
        const card = el('div','src');
        card.append(el('span','dot ' + (ok ? 'ok' : v.health === 'unknown' ? '' : 'warn')));
        const txt = el('div');
        txt.append(el('b','', SOURCE_NAME[name] || name), el('small','', ok ? `${v.items} items last check` : (v.detail || v.health)));
        card.append(txt); srcs.append(card);
      }
      if(srcs.children.length) b.append(srcs);
    }

    // everything it has shown, by day, searchable
    b.append(el('div','label','Everything it has shown'));
    const find = el('div','find');
    const input = el('input');
    input.type = 'search';
    input.placeholder = 'Search for something she saw…';
    input.value = query;
    input.addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); shown = {}; render(); input.focus(); });
    find.append(input);
    const chip = (label, on, fn) => { const c = el('button','chip' + (on ? ' on' : ''), label); c.type='button'; c.addEventListener('click', fn); find.append(c); };
    chip('♥ liked', likedOnly, () => { likedOnly = !likedOnly; shown = {}; render(); });
    for(const t of TOPICS) chip(t, topic === t, () => { topic = topic === t ? '' : t; shown = {}; render(); });
    b.append(find);

    const days = data.days || [];
    if(!days.length){
      b.append(el('p','empty','Nothing saved yet. The Pi sends its history every few minutes.'));
      $('fresh').textContent = 'checked ' + new Date().toLocaleTimeString();
      return;
    }

    let total = 0;
    const sections = [];
    for(const d of days){
      const items = (d.items || []).filter(matches);
      total += items.length;
      if(!items.length) continue;
      const sec = el('section','day');
      const head = el('div','day-head');
      head.append(el('h2','', dayName(d.date)));
      const parts = [`${d.count} shown`];
      if(d.liked) parts.push(`${d.liked} liked`);
      if(d.watchedMinutes) parts.push(`${d.watchedMinutes} min watched`);
      head.append(el('small','', parts.join(' · ')));
      sec.append(head);
      const limit = shown[d.date] || PAGE;
      for(const it of items.slice(0, limit)) sec.append(itemRow(it));
      if(items.length > limit){
        const more = el('button','more', `Show ${Math.min(PAGE, items.length - limit)} more from ${dayName(d.date).toLowerCase()}`);
        more.type = 'button';
        more.addEventListener('click', () => { shown[d.date] = limit + PAGE; render(); });
        sec.append(more);
      }
      sections.push(sec);
    }

    if(query || likedOnly || topic) b.append(el('p','found', total ? `${total} ${total === 1 ? 'match' : 'matches'}` : 'Nothing matches that.'));
    for(const sec of sections) b.append(sec);
    if(!sections.length && !(query || likedOnly || topic)) b.append(el('p','empty','Nothing shown yet.'));

    $('fresh').textContent = 'checked ' + new Date().toLocaleTimeString();
  }

  async function load(){
    if(!KEY){ data = null; render(); return; }
    try{
      const r = await fetch(API + '/trends?days=30', { headers: { Authorization: 'Bearer ' + KEY }, cache: 'no-store' });
      data = r.ok ? await r.json() : null;
    }catch{ data = null; }
    render();
  }
  $('refresh').addEventListener('click', load);
  load();
  // refresh quietly, but never while she is in the middle of typing a search
  setInterval(() => { if(!document.activeElement || document.activeElement.tagName !== 'INPUT') load(); }, 60000);
</script>
</body>
</html>
