<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DoodleLife</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 16c4-7 13-8 18-2l6-5v14l-6-5c-5 6-14 5-18-2z%27 fill=%27none%27 stroke=%27%232A2D34%27 stroke-width=%272.4%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2710%27 cy=%2715%27 r=%271.8%27 fill=%27%232A2D34%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <canvas id="world"></canvas>
  <div class="hello" id="hello">
    <div class="big">Draw something.</div>
    <div class="sub">Try <span id="idea">a fish</span>. When you stop, it comes alive.</div>
    <div class="credit">Recognition by <a href="LICENSES.txt" target="_blank" rel="noopener">DoodleNet (ml5.js)</a>, trained on Google's Quick, Draw! drawings. Runs on your device.</div>
  </div>
  <div class="tag" id="tag" hidden></div>
  <div class="chips" id="chips" hidden></div>

  <div class="hint" id="hint"></div>
  <video id="peek" class="peek" autoplay muted playsinline hidden></video>
  <div class="bar">
    <div class="inks" id="inks"></div>
    <button id="see" title="Turn on your camera so they can look at you (nothing leaves your device)">👀 Camera</button>
    <button id="share" title="Copy a link to this scene">Share</button>
    <button id="undo" title="Remove the last creature (⌘Z)">Undo</button>
    <button id="clear" title="Clear everything">Clear</button>
    <button id="sound" title="Sound (M)">🔊</button>
  </div>
</body>
</html>
