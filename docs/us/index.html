<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>&nbsp;</title>
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:'Inter';src:url('../fonts/Inter-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Space Grotesk';src:url('../fonts/SpaceGrotesk-latin.woff2') format('woff2');font-weight:300 700;font-display:swap}
  :root{
    --paper:#fbf7f2; --ink:#1a1714; --muted:#857a70; --line:#e8ded2;
    --accent:#b4553f; --shadow:rgba(60,40,25,.16); --edge:#fff;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#15130f; --ink:#f3ece2; --muted:#9a8f82; --line:#2c2821;
    --accent:#e0917a; --shadow:rgba(0,0,0,.55); --edge:#211d17;
  }}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;
       font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- lock ---------- */
  #lock{min-height:100svh;display:grid;place-items:center;padding:24px}
  #lock form{width:100%;max-width:320px;text-align:center}
  #lock label{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
              color:var(--muted);margin-bottom:18px}
  #code{width:100%;padding:13px 14px;font:inherit;font-size:17px;text-align:center;
        background:transparent;color:var(--ink);border:0;border-bottom:1.5px solid var(--line);
        border-radius:0;outline:none;transition:border-color .2s}
  #code:focus{border-bottom-color:var(--accent)}
  #go{margin-top:22px;padding:11px 26px;font:inherit;font-size:15px;cursor:pointer;
      background:var(--ink);color:var(--paper);border:0;border-radius:999px}
  #go[disabled]{opacity:.45;cursor:default}
  #msg{min-height:1.4em;margin-top:16px;font-size:14px;color:var(--muted)}
  #msg.bad{color:var(--accent)}

  /* ---------- the note ---------- */
  #panel{display:none}
  #note{max-width:33rem;margin:0 auto;padding:22vh 24px 14vh;text-align:center}
  #note h1{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:-.02em;
           font-size:clamp(30px,8vw,52px);line-height:1.1;margin:0 0 .9em}
  #note p{margin:0 0 1.15em;font-size:clamp(16px,2.4vw,18px);white-space:pre-wrap}
  #cue{margin-top:12vh;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  #cue span{display:block;margin-top:10px;font-size:18px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 6px}}

  /* ---------- chapters ---------- */
  .chapter{padding:0 0 16vh}
  /* reserve a lane for the rail so its labels never sit over a photo */
  @media(min-width:900px){ .chapter{padding-right:210px} }
  .chapter:not(:first-of-type){content-visibility:auto;contain-intrinsic-size:auto 1200px}
  .chead{position:sticky;top:0;z-index:30;padding:18px 0 14px;text-align:center;
         background:linear-gradient(var(--paper) 62%,transparent)}
  .chead h2{font-family:'Space Grotesk',sans-serif;font-weight:500;margin:0;
            font-size:clamp(17px,3.4vw,22px);letter-spacing:-.01em}
  .chead .cnt{display:block;margin-top:3px;font-size:11px;letter-spacing:.16em;
              text-transform:uppercase;color:var(--muted)}

  /* the pile: tight columns, overlapping, slightly tilted */
  .cluster{columns:2;column-gap:8px;padding:0 12px;max-width:1240px;margin:0 auto}
  @media(min-width:640px){.cluster{columns:3;column-gap:12px;padding-inline:32px}}
  @media(min-width:1040px){.cluster{columns:4;column-gap:14px;padding-inline:56px}}
  .ph{break-inside:avoid;display:block;width:100%;margin:0 0 -22px;padding:0;border:0;
      background:none;cursor:zoom-in;line-height:0;position:relative;
      transition:scale .22s ease, filter .22s ease}
  .ph img{width:100%;height:auto;display:block;background:var(--line);
          border:5px solid var(--edge);border-radius:2px;box-shadow:0 7px 24px var(--shadow)}
  .ph:hover,.ph:focus-visible{scale:1.05;z-index:40;rotate:0deg;outline:none}
  .ph:focus-visible img{outline:2px solid var(--accent);outline-offset:3px}

  /* photos rise in as they scroll into view */
  @supports (animation-timeline: view()){
    @media (prefers-reduced-motion: no-preference){
      @keyframes rise{from{opacity:0;translate:0 26px}}
      .ph{animation:rise linear both;animation-timeline:view();
          animation-range:entry 0% entry 55%}
    }
  }

  /* ---------- chapter rail ---------- */
  #rail{position:fixed;right:18px;top:50%;translate:0 -50%;z-index:60;display:none;
        flex-direction:column;gap:9px;align-items:flex-end}
  @media(min-width:900px){#rail.on{display:flex}}
  #rail button{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
               color:var(--muted);font:inherit;font-size:11px;letter-spacing:.06em;padding:2px 0}
  #rail .dot{width:7px;height:7px;border-radius:999px;background:var(--line);
             border:1px solid var(--muted);transition:background .2s, scale .2s}
  #rail .lbl{opacity:0;transition:opacity .2s;white-space:nowrap}
  #rail button:hover .lbl,#rail button[aria-current="true"] .lbl{opacity:1}
  #rail button[aria-current="true"]{color:var(--ink)}
  #rail button[aria-current="true"] .dot{background:var(--accent);border-color:var(--accent);scale:1.3}

  /* ---------- lightbox ---------- */
  #box{position:fixed;inset:0;background:rgba(10,8,6,.94);display:none;place-items:center;
       z-index:100;padding:16px;backdrop-filter:blur(4px)}
  #box.on{display:grid}
  #big{max-width:100%;max-height:88svh;border-radius:3px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
  #box .nav{position:absolute;top:0;bottom:0;width:28%;border:0;background:none;cursor:pointer}
  #box .prev{left:0}#box .next{right:0}
  #close{position:absolute;top:14px;right:16px;width:40px;height:40px;border:0;border-radius:999px;
         background:rgba(255,255,255,.14);color:#fff;font-size:21px;cursor:pointer;line-height:1}
  #cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.72);
       font-size:13px;letter-spacing:.04em;pointer-events:none}
  #cap b{display:block;font-weight:500;color:#fff;margin-bottom:2px}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
    *{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lock">
  <form id="f">
    <label for="code">enter the code</label>
    <input id="code" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <br><button id="go" type="submit">open</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<main id="panel">
  <section id="note"></section>
  <div id="chapters"></div>
</main>

<nav id="rail" aria-label="chapters"></nav>

<div id="box" role="dialog" aria-modal="true" aria-label="photo">
  <button class="nav prev" id="prev" aria-label="previous"></button>
  <img id="big" alt="">
  <button class="nav next" id="next" aria-label="next"></button>
  <button id="close" aria-label="close">&times;</button>
  <div id="cap"></div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const sub = crypto.subtle;
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));

let KEY = null, BUILD = '', ITEMS = [], CHAPS = [], URLS = [], open = -1;

const dec = async b => new Uint8Array(await sub.decrypt({name:'AES-GCM', iv:b.slice(0,12)}, KEY, b.slice(12)));
async function grab(path){
  const r = await fetch(`${path}?b=${BUILD}`, { cache:'force-cache' });
  if (!r.ok) throw new Error(path);
  return new Uint8Array(await r.arrayBuffer());
}

async function unlock(code){
  if (!code) return;
  $('#go').disabled = true; $('#msg').className = ''; $('#msg').textContent = 'one moment…';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  try {
    const p = await (await fetch('params.json', { cache:'no-cache' })).json();
    BUILD = p.build || '0';
    const base = await sub.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    const bits = await sub.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:unb64(p.salt), iterations:p.iterations}, base, 256);
    KEY = await sub.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    reveal(JSON.parse(new TextDecoder().decode(await dec(await grab('meta.bin')))));
  } catch {
    $('#msg').className = 'bad'; $('#msg').textContent = "that's not it";
    $('#go').disabled = false; $('#code').select();
  }
}
$('#f').addEventListener('submit', e => { e.preventDefault(); unlock($('#code').value.trim().toLowerCase()); });

// A code in the hash (typed, or forwarded by the site's 404 page) opens it directly.
const fromHash = decodeURIComponent(location.hash.replace(/^#/, '')).trim().toLowerCase();
if (fromHash) { history.replaceState(null, '', location.pathname); unlock(fromHash); }

const rnd = i => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
const pretty = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US',
  { weekday:'long', month:'long', day:'numeric', year:'numeric' });

function reveal(meta){
  const [head, ...rest] = meta.message.split('\n');
  const note = $('#note');
  const h = document.createElement('h1'); h.textContent = head; note.append(h);
  for (const para of rest.join('\n').split(/\n{2,}/)) {
    if (!para.trim()) continue;
    const el = document.createElement('p'); el.textContent = para.trim(); note.append(el);
  }
  const cue = document.createElement('div');
  cue.id = 'cue'; cue.innerHTML = 'keep going<span aria-hidden="true">&darr;</span>';
  note.append(cue);

  ITEMS = meta.items; CHAPS = meta.chapters; URLS = new Array(ITEMS.length);
  $('#lock').style.display = 'none';
  $('#panel').style.display = 'block';
  buildChapters();
  buildRail();
  loadPacks(meta.packs);
}

function buildChapters(){
  const wrap = $('#chapters');
  CHAPS.forEach((title, ci) => {
    const mine = ITEMS.map((it, i) => ({ it, i })).filter(o => o.it.c === ci);
    const sec = document.createElement('section');
    sec.className = 'chapter'; sec.id = 'ch' + ci;
    sec.innerHTML = `<div class="chead"><h2>${title}</h2>
      <span class="cnt">${mine.length} photo${mine.length === 1 ? '' : 's'}</span></div>`;
    const cl = document.createElement('div'); cl.className = 'cluster';
    for (const { it, i } of mine) {
      const b = document.createElement('button');
      b.className = 'ph'; b.type = 'button';
      b.style.rotate = `${(rnd(i) - .5) * 5}deg`;
      b.style.marginLeft = `${(rnd(i + 7) - .5) * 7}%`;
      b.style.zIndex = Math.floor(rnd(i + 99) * 20);
      b.setAttribute('aria-label', pretty(it.d));
      const img = document.createElement('img');
      img.width = it.w; img.height = it.h; img.alt = '';
      img.style.aspectRatio = `${it.w} / ${it.h}`;
      b.append(img);
      b.addEventListener('click', () => show(i));
      cl.append(b);
    }
    sec.append(cl); wrap.append(sec);
  });
}

function buildRail(){
  const rail = $('#rail');
  CHAPS.forEach((title, ci) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="lbl">${title}</span><span class="dot"></span>`;
    b.addEventListener('click', () => document.getElementById('ch' + ci)
      .scrollIntoView({ behavior:'smooth', block:'start' }));
    rail.append(b);
  });
  rail.classList.add('on');
  const btns = [...rail.children];
  const io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) {
      const ci = +e.target.id.slice(2);
      btns.forEach((b, i) => b.setAttribute('aria-current', String(i === ci)));
    }
  }, { rootMargin: '-45% 0px -45% 0px' });
  CHAPS.forEach((_, ci) => io.observe(document.getElementById('ch' + ci)));
}

async function loadPacks(packs){
  let at = 0;
  const imgs = [...document.querySelectorAll('.ph img')];
  for (const name of packs) {
    try {
      const raw = await dec(await grab(name));
      const view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
      let o = 0;
      while (o < raw.length) {
        const len = view.getUint32(o, true); o += 4;
        const url = URL.createObjectURL(new Blob([raw.slice(o, o + len)], { type:'image/jpeg' }));
        o += len;
        if (imgs[at]) imgs[at].src = url;
        at++;
      }
    } catch { /* a failed pack just leaves placeholders */ }
  }
}

async function show(i){
  if (i < 0 || i >= ITEMS.length) return;
  open = i;
  $('#box').classList.add('on');
  $('#cap').innerHTML = `<b>${pretty(ITEMS[i].d)}</b>${i + 1} of ${ITEMS.length}`;
  $('#big').src = document.querySelectorAll('.ph img')[i]?.src || '';
  $('#close').focus();
  if (!URLS[i]) {
    try { URLS[i] = URL.createObjectURL(
      new Blob([await dec(await grab(`f/${ITEMS[i].n}.bin`))], { type:'image/jpeg' })); }
    catch { return; }
  }
  if (open === i) $('#big').src = URLS[i];
}

const shut = () => { $('#box').classList.remove('on'); open = -1; };
$('#close').addEventListener('click', shut);
$('#prev').addEventListener('click', () => show(open - 1));
$('#next').addEventListener('click', () => show(open + 1));
$('#box').addEventListener('click', e => { if (e.target === $('#box')) shut(); });
addEventListener('keydown', e => {
  if (!$('#box').classList.contains('on')) return;
  if (e.key === 'Escape') shut();
  if (e.key === 'ArrowLeft') show(open - 1);
  if (e.key === 'ArrowRight') show(open + 1);
});
</script>
</body>
</html>
