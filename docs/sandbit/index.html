<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231b1a2b'/%3E%3Cpath fill='%23e8c170' d='M3 3h2v1h1v1h1v2H1V5h1V4h1z'/%3E%3Cpath fill='%23ff6a4a' d='M3 1h1v1H3z'/%3E%3Cpath fill='%23cfa257' d='M2 6h1v1H2zM5 5h1v1H5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="logo" aria-label="Sandbit"><span>SAND</span><b>BIT</b></div>
    <div class="group" id="tools" role="toolbar" aria-label="Tools"></div>
    <div class="group" role="group" aria-label="Brush size">
      <label class="size" title="Brush size ( [ and ] )">
        <span>SIZE</span>
        <input type="range" id="size" min="1" max="20" value="4" aria-label="Brush size">
        <b id="sizeVal">4</b>
      </label>
    </div>
    <div class="group" role="group" aria-label="Time">
      <button class="btn" id="play" title="Pause / play (Space)">PAUSE</button>
      <button class="btn" id="stepBtn" title="Step one frame (.)">STEP</button>
      <button class="btn" id="speed" title="Simulation speed">1X</button>
    </div>
    <div class="spacer"></div>
    <div class="group" role="group" aria-label="Scene">
      <button class="btn accent" id="levelsBtn" title="Mini challenges">CHALLENGES</button>
      <button class="btn" id="undo" title="Undo (Ctrl+Z)">UNDO</button>
      <button class="btn" id="clearBtn" title="Clear everything (undoable)">CLEAR</button>
      <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" title="More">MORE</button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="saveBtn">Save scene file</button>
        <button role="menuitem" id="loadBtn">Load scene file</button>
        <button role="menuitem" id="shareBtn">Copy share link</button>
        <button role="menuitem" id="pictureBtn">Save picture (PNG)</button>
        <hr>
        <button role="menuitemcheckbox" id="soundBtn" aria-checked="true">Sound</button>
        <button role="menuitemcheckbox" id="glowBtn" aria-checked="true">Glow</button>
        <button role="menuitemcheckbox" id="crtBtn" aria-checked="false">CRT scanlines</button>
        <button role="menuitemcheckbox" id="debugBtn" aria-checked="false">Show active chunks (D)</button>
        <hr>
        <button role="menuitem" id="demoBtn">Example scenes</button>
        <button role="menuitem" id="helpBtn">Controls (?)</button>
        <button role="menuitem" id="howBtn">How it works</button>
      </div>
      <input type="file" id="fileIn" accept=".sbt,application/octet-stream" hidden>
    </div>
  </header>

  <div class="main">
    <aside class="palette" id="palette" aria-label="Materials"></aside>
    <div class="stage" id="stage">
      <div class="screen" id="screen">
        <canvas id="gl"></canvas>
        <canvas id="ov" aria-label="Simulation. Click and drag to paint."></canvas>
        <div class="hud" id="hud" hidden>
          <div class="hud-top"><b id="hudName"></b><button class="btn tiny" id="hudReset" title="Restart (R)">RESTART</button><button class="btn tiny" id="hudExit">EXIT</button></div>
          <p id="hudBrief"></p>
          <div class="meter"><i id="hudBar"></i></div>
          <p class="hud-goal" id="hudGoal"></p>
          <p class="hud-res" id="hudRes"></p>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <footer class="status" id="status" aria-live="off"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog-head"><h2 id="modalTitle"></h2><button class="btn tiny" id="modalClose" aria-label="Close">X</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<noscript><p class="nojs">Sandbit needs JavaScript and WebAssembly.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
